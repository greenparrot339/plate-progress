function positionStatsFloatCard(pos){
  const wrap=document.getElementById('stats3d-wrap');
  const card=document.getElementById('stats3d-float');
  const leader=document.getElementById('stats3d-leader');
  if(!wrap || !card || !leader) return;
  // While the selected point has rotated around to the far side of the model, its
  // on-screen projection is no longer meaningful (a point behind the object can
  // project to an arbitrary/misleading screen position), which is what let the
  // card jump to and stick on the wrong side while rotating. Just hide it until
  // the point faces the camera again, rather than positioning off a bad value.
  if(pos.visible===false){
    card.classList.remove('show');
    leader.innerHTML='';
    return;
  }
  card.classList.add('show');
  leader.setAttribute('viewBox', `0 0 ${pos.w} ${pos.h}`);
  const cw = Math.min(180, Math.max(132, card.offsetWidth || 150));
  const ch = card.offsetHeight || 96;
  const onRight = pos.x < pos.w/2;
  let left = onRight ? pos.x + 26 : pos.x - 26 - cw;
  left = Math.max(8, Math.min(pos.w - cw - 8, left));
  let top = pos.y - ch/2;
  top = Math.max(8, Math.min(pos.h - ch - 8, top));
  card.style.left = left+'px';
  card.style.top = top+'px';
  const edgeX = onRight ? left : left+cw;
  const edgeY = Math.max(top+10, Math.min(top+ch-10, pos.y));
  leader.innerHTML = `<line x1="${pos.x.toFixed(1)}" y1="${pos.y.toFixed(1)}" x2="${edgeX.toFixed(1)}" y2="${edgeY.toFixed(1)}"/>
    <circle cx="${pos.x.toFixed(1)}" cy="${pos.y.toFixed(1)}" r="3.5"/>`;
}

/* ============ PROGRESS: MODE SWITCHER (Exercise / Day / Split) ============ */
// A lightweight, tappable "orbit" selector between the three Progress reports.
// It intentionally avoids a literal fake-3D hologram (per spec) in favor of an
// elegant, mobile-cheap tri-state control that still feels like a single
// rotating analytics object: the active segment lifts and a dot-strip below
// echoes the existing plate-rule tab indicator idiom used elsewhere in the app.
function progressModesAvailable(){
  const modes = ['exercise','day'];
  if(DB.splits.length>=2) modes.push('split');
  return modes;
}
function buildProgressModeSwitcherHtml(){
  const modes = progressModesAvailable();
  if(!modes.includes(state.progressMode)) state.progressMode = 'exercise';
  const icons = {
    exercise:'<svg viewBox="0 0 24 24"><path d="M4 19V9M11 19V4M18 19v-6" stroke-linecap="round"/></svg>',
    day:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18" stroke-linecap="round"/></svg>',
    split:'<svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="6" r="3"/><circle cx="17" cy="18" r="3"/><path d="M9.5 10.5L14.5 7.5M9.5 13.5L14.5 16.5" stroke-linecap="round"/></svg>'
  };
  const labels = {exercise:'Exercise',day:'Day',split:'Split'};
  return `<div class="card progress-modes-card">
    <div class="progress-modes">
      ${modes.map(m=>`<button data-mode="${m}" class="${state.progressMode===m?'active':''}">${icons[m]}${labels[m]}</button>`).join('')}
    </div>
    <div class="progress-orbit-dots">${modes.map(m=>`<span class="od ${state.progressMode===m?'hot':''}"></span>`).join('')}</div>
  </div>`;
}
function bindProgressModeSwitcher(){
  document.querySelectorAll('.progress-modes [data-mode]').forEach(b=>{
    b.onclick = ()=>{
      if(state.progressMode===b.dataset.mode) return;
      state.progressMode = b.dataset.mode;
      render();
    };
  });
}

function renderProgress(){
  if(!DB.splits.length){ setHeader('Progress','No data yet',null,null); renderOnboarding(); return; }
  const modes = progressModesAvailable();
  if(!modes.includes(state.progressMode)) state.progressMode = 'exercise';
  if(state.progressMode==='day'){ renderProgressDayMode(); return; }
  if(state.progressMode==='split'){ renderProgressSplitMode(); return; }
  renderProgressExerciseMode();
}

function renderProgressExerciseMode(){
  if(!DB.splits.length){ setHeader('Progress','No data yet',null,null); renderOnboarding(); return; }
  if(!state.progressSplitId) state.progressSplitId = (activeSplit()||DB.splits[0]).id;
  const split = splitById(state.progressSplitId) || activeSplit() || DB.splits[0];
  state.progressSplitId = split.id;

  setHeader('Progress', split.name, null, null);

  const allDayIds = split.days.map(d=>d.id);
  const exListRaw = DB.exercises.filter(e=> allDayIds.includes(e.dayId));
  // Active exercises with the same identity pool their sets together (see
  // matchingExerciseIds), so they should only show once here. Archived exercises are
  // frozen snapshots that never merge with anything — including each other — so every
  // archived exercise keeps its own entry instead of being hidden behind, or hiding, a
  // same-named active one.
  const seenExKeys = new Set();
  const exList = exListRaw.filter(e=>{
    if(e.archived) return true;
    const key = exerciseIdentityKey(e.name);
    if(seenExKeys.has(key)) return false;
    seenExKeys.add(key);
    return true;
  });

  // most recently trained first (never-trained last), so the lift you just did is at the top of the list
  const lastTrainedMap = new Map(exList.map(e=>{ const ss=setsOfExercise(e.id); return [e.id, ss.length ? ss[ss.length-1].date : '']; }));
  exList.sort((a,b)=> (lastTrainedMap.get(b.id)||'').localeCompare(lastTrainedMap.get(a.id)||''));

  let html = buildProgressModeSwitcherHtml();

  html += `<div class="card">
    <div class="card-title">Viewing split</div>
    <select id="p-split">
      ${DB.splits.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(s=>`<option value="${s.id}" ${s.id===split.id?'selected':''}>${esc(s.name)}${s.archivedAt?' (archived)':' (active)'}</option>`).join('')}
    </select>
  </div>`;

  if(exList.length===0){
    html += `<div class="empty"><p>No exercises logged under this split yet.</p></div>`;
    $main.innerHTML = html;
    bindProgressModeSwitcher();
    document.getElementById('p-split').onchange = e=>{ state.progressSplitId=e.target.value; state.progressExerciseId=null; render(); };
    return;
  }

  if(!state.progressExerciseId || !exList.some(e=>e.id===state.progressExerciseId)){
    const withSets = exList.find(e=> setsOfExercise(e.id).some(isWorkingPerformanceSet)) || exList.find(e=> setsOfExercise(e.id).length>0);
    state.progressExerciseId = (withSets||exList[0]).id;
  }

  html += `<div class="card">
    <div class="card-title">Exercise${exList.length>8?` <span class="card-title-sub">${exList.length} lifts &middot; recent first</span>`:''}</div>
    ${exList.length>8?`<input id="p-ex-search" type="search" placeholder="Search exercises" autocomplete="off" style="margin-bottom:8px;">`:''}
    <select id="p-exercise">
      ${exList.map(e=>`<option value="${e.id}" ${e.id===state.progressExerciseId?'selected':''}>${esc(e.name)}${e.archived?' (archived)':''}</option>`).join('')}
    </select>
  </div>`;

  const sets = setsOfExercise(state.progressExerciseId).filter(isWorkingPerformanceSet);

  if(sets.length===0){
    const bwOnly = setsOfExercise(state.progressExerciseId).some(s=>isWorkingSet(s) && Number(s.reps)>0);
    html += `<div class="empty"><p>${bwOnly ? 'This exercise only has bodyweight sets (no weight logged), so it can&rsquo;t be charted by load here. Its reps still show up in the Day view.' : 'No sets logged for this exercise yet — log one from the Log tab.'}</p></div>`;
    $main.innerHTML = html;
    bindProgressModeSwitcher();
    bindProgressSelectors();
    return;
  }

  // ---- progressive-overload trend ----
  // Progress is tracked at the same weight. A session contributes its best
  // reps at that weight, and the baseline is the median of the four most
  // recent qualifying sessions before the current session.
  function median4(values){
    const a = values.slice().sort((x,y)=>x-y);
    if(!a.length) return null;
    const m=Math.floor(a.length/2);
    return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
  }
  function fmtRepValue(v){ return Number.isInteger(v) ? String(v) : Number(v).toFixed(1); }
  function buildProgressiveOverloadTrend(exerciseSets){
    const grouped={};
    exerciseSets.forEach(s=>{
      const d=s.date;
      const w=Number(s.weight);
      const r=Number(s.reps);
      if(!Number.isFinite(w)||!Number.isFinite(r)) return;
      if(!grouped[d]) grouped[d]=[];
      grouped[d].push({weight:w,reps:r});
    });

    const dates=Object.keys(grouped).sort();
    if(!dates.length) return {status:'insufficient',title:'Building baseline',note:'Log more sessions to establish a same-weight performance baseline.',html:'&mdash;'};

    const latestDate=dates[dates.length-1];
    const latestSets=grouped[latestDate];
    const currentWeight=Math.max(...latestSets.map(s=>s.weight));
    const currentAtWeight=latestSets.filter(s=>s.weight===currentWeight);

    // The current session is represented by the median reps across every
    // set performed at the tracked weight. This works for 2, 3, 4, 5, etc.
    // sets and prevents one unusually strong final set from masking a dip.
    const currentReps=median4(currentAtWeight.map(s=>s.reps));
    const currentSetCount=currentAtWeight.length;
    const currentBestReps=Math.max(...currentAtWeight.map(s=>s.reps));

    // A genuinely new load is positive progression when it is performed
    // for more than a single rep. This is treated separately from the
    // same-weight baseline system because there is no same-weight baseline
    // to compare against yet.
    const previousWeights=dates.slice(0,-1).flatMap(date=>grouped[date].map(s=>s.weight));
    const previousMaxWeight=previousWeights.length ? Math.max(...previousWeights) : null;
    const isNewWeight=previousMaxWeight!=null && currentWeight>previousMaxWeight;
    const newWeightPositive=isNewWeight && currentReps>1;

    const sessionSummary = currentSetCount > 1
      ? `Session: ${currentSetCount} sets &middot; Median: ${fmtRepValue(currentReps)} reps${currentBestReps!==currentReps ? ` &middot; Best: ${fmtRepValue(currentBestReps)} reps` : ''}`
      : `Session: 1 set &middot; ${fmtRepValue(currentReps)} reps`;

    // Only compare sessions performed at the exact same weight. A weight
    // change therefore starts a fresh progression track automatically.
    // A new weight with more than one rep is an immediate positive result.
    // Do not wait for four same-weight sessions to establish a baseline.
    if(newWeightPositive){
      return {
        status:'new-weight',
        statusClass:'trend-up',
        title:'Positive progression',
        note:`New load achieved at ${fmtRepValue(currentWeight)} kg with a session median above 1 rep. This represents positive progression.`,
        currentWeight,currentReps,currentBestReps,currentSetCount,
        baseline:null,prior:[],latestDate,followups:0,confirms:0,diff:null,signed:null,
        html:`<span class="trend-up">&uarr; Positive</span>`
      };
    }

    const rows=dates.map(date=>{
      const atWeight=grouped[date].filter(s=>s.weight===currentWeight);
      if(!atWeight.length) return null;
      return {
        date,
        reps:median4(atWeight.map(s=>s.reps)),
        bestReps:Math.max(...atWeight.map(s=>s.reps)),
        setCount:atWeight.length
      };
    }).filter(Boolean);

    const prior=rows.filter(r=>r.date!==latestDate).slice(-4);
    if(prior.length<4){
      return {
        status:'insufficient',
        title:'Building baseline',
        note:`Need ${4-prior.length} more same-weight session${4-prior.length===1?'':'s'} to establish the baseline.`,
        currentWeight,currentReps,currentBestReps,currentSetCount,prior,latestDate,
        html:`<span style="color:var(--text-dim);">Building baseline</span>`
      };
    }

    const baseline=median4(prior.map(r=>r.reps));
    const diff=currentReps-baseline;
    const signed=diff>0?`+${fmtRepValue(diff)}`:diff<0?fmtRepValue(diff):'0';

    // Detect the start of the most recent underperformance streak. The
    // baseline is anchored to the four sessions immediately BEFORE the
    // first below-baseline session, then frozen for the three-session watch
    // window. This prevents later below-baseline sessions from becoming part
    // of a new rolling baseline and incorrectly lowering the benchmark.
    let recentWatch=null;
    for(let i=4;i<rows.length;i++){
      const b=median4(rows.slice(i-4,i).map(r=>r.reps));
      if(rows[i].reps<b){
        const previous=rows[i-1];
        const startsNewDip = !previous || previous.reps>=b;
        if(startsNewDip){
          const followups=rows.slice(i+1,i+4);
          recentWatch={index:i,baseline:b,followups};
        }
      }
    }

    let status='maintained';
    let title='Maintained';
    let note='Session performance is in line with the recent baseline.';
    let statusClass='';
    let followups=0;
    let confirms=0;

    // If the latest session is a follow-up to a prior underperformance,
    // explicitly report recovery/persistence before treating it as a new event.
    if(recentWatch){
      const latestIsFollowup=recentWatch.followups.some(r=>r.date===latestDate);
      if(latestIsFollowup){
        const seen=recentWatch.followups.filter(r=>r.date<=latestDate);
        const recovered=seen.some(r=>r.reps>=recentWatch.baseline);
        if(recovered){
          status='recovered';
          title='Recovered';
          statusClass='trend-up';
          note=`Returned to at least the ${fmtRepValue(recentWatch.baseline)}-rep baseline after the earlier dip. No regression is recorded.`;
          return {status,statusClass,title,note:`${note}|${sessionSummary}`,currentWeight,currentReps,currentBestReps,currentSetCount,baseline,prior,latestDate,followups:seen.length,confirms,diff,signed,
            html:`<span class="trend-up">&uarr; Recovered</span>`};
        }
        if(seen.length>=3){
          status='persistent';
          title='Persistent underperformance';
          statusClass='trend-down';
          note=`The last 3 follow-up sessions stayed below the ${fmtRepValue(recentWatch.baseline)}-rep baseline. Consider this a persistent dip at this weight.`;
          return {status,statusClass,title,note:`${note}|${sessionSummary}`,currentWeight,currentReps,currentBestReps,currentSetCount,baseline,prior,latestDate,followups:3,confirms,diff,signed,
            html:`<span class="trend-down">&darr; Persistent</span>`};
        }
        if(currentReps<baseline){
          status='watch';
          title='Performance watch';
          statusClass='trend-down';
          followups=seen.length;
          note=`Below baseline. Monitoring follow-up ${seen.length} of 3 at this weight.`;
          return {status,statusClass,title,note:`${note}|${sessionSummary}`,currentWeight,currentReps,currentBestReps,currentSetCount,baseline,prior,latestDate,followups,confirms,diff,signed,
            html:`<span class="trend-down">&darr; Monitoring ${seen.length}/3</span>`};
        }
      }
    }

    if(currentReps>baseline){
      // A higher session median is an improvement, but it is not allowed to
      // replace the established baseline until three sessions confirm it.
      confirms=1;
      const previousRows=rows.filter(r=>r.date!==latestDate).slice(-3);
      for(let i=previousRows.length-1;i>=0;i--){
        if(previousRows[i].reps>=currentReps) confirms++;
        else break;
      }
      if(confirms>=3){
        status='confirmed';
        title='New level confirmed';
        statusClass='trend-up';
        note=`${confirms} recent sessions support ${currentWeight}kg &times; ${fmtRepValue(currentReps)}. The new level is now confirmed.`;
      }else{
        status='improved';
        title='Improved';
        statusClass='trend-up';
        note=`Session median is above the baseline. Keep tracking it for ${3-confirms} more confirming session${3-confirms===1?'':'s'} before rebuilding the baseline.`;
      }
    }else if(currentReps<baseline){
      status='watch';
      title='Performance watch';
      statusClass='trend-down';
      note=`Below the established baseline. Performance will be monitored across the next 3 same-weight sessions before identifying a regression.`;
      followups=0;
    }

    note = `${note}|${sessionSummary}`;

    return {
      status,statusClass,title,note,currentWeight,currentReps,currentBestReps,currentSetCount,
      baseline,prior,latestDate,followups,confirms,diff,signed,
      html:`<span class="${statusClass}">${status==='watch'?'&darr; Monitoring':status==='maintained'?'&rarr; 0 reps':'&uarr; '+signed+' reps'}</span>`
    };
  }

// ---- stats ----
  const weights = sets.map(s=>s.weight);
  const prWeight = Math.max(...weights);
  const setsAtPrWeight = sets.filter(s=>s.weight===prWeight);
  const prSet = setsAtPrWeight.reduce((best,s)=> s.reps>best.reps ? s : best, setsAtPrWeight[0]);
  const totalVolume = sets.reduce((a,s)=>a+(isWorkingSet(s)?s.weight*s.reps:0),0);
  const sessionsMap = {};
  sets.forEach(s=>{ (sessionsMap[s.date]=sessionsMap[s.date]||[]).push(s); });
  const sessionDates = Object.keys(sessionsMap).sort();
  const sessionCount = sessionDates.length;
  const avgReps = (sets.reduce((a,s)=>a+s.reps,0)/sets.length).toFixed(1);

  let trendHtml = '';
  if(sessionDates.length>=2){
    const lastDate = sessionDates[sessionDates.length-1];
    const prevDate = sessionDates[sessionDates.length-2];
    const lastTop = Math.max(...sessionsMap[lastDate].map(s=>s.weight));
    const prevTop = Math.max(...sessionsMap[prevDate].map(s=>s.weight));
    const diff = lastTop - prevTop;
    if(diff>0) trendHtml = `<span class="trend-up">&uarr; +${diff}kg</span> vs last session`;
    else if(diff<0) trendHtml = `<span class="trend-down">&darr; ${diff}kg</span> vs last session`;
    else trendHtml = `<span style="color:var(--text-dim);">&rarr; same</span> as last session`;
  }
  const overload = buildProgressiveOverloadTrend(sets);

  // ---- estimated-1RM view of this lift (weight AND reps in one number) ----
  const ex0 = exerciseById(state.progressExerciseId);
  const e1s = e1rmSessions(ex0);
  const hasE1 = e1s.length>=2;
  const metric = (state.progressMetric==='e1rm' && !hasE1) ? 'weight' : state.progressMetric;
  const bestE1 = e1s.length ? e1s.reduce((b,x)=>x.e1rm>b.e1rm?x:b, e1s[0]) : null;
  const pctClass = v => v>PROGRESS_FLAT_PCT ? 'trend-up' : v<-PROGRESS_FLAT_PCT ? 'trend-down' : '';
  let e1TrendHtml = '';
  if(e1s.length>=2){
    const a=e1s[e1s.length-1], b=e1s[e1s.length-2], pct=(a.e1rm/b.e1rm-1)*100;
    e1TrendHtml = Math.abs(pct)<=PROGRESS_FLAT_PCT ? `<span style="color:var(--text-dim);">&rarr; same</span> est. 1RM` : `<span class="${pctClass(pct)}">${pct>0?'&uarr;':'&darr;'} ${fmtSignedPct(pct)}</span> est. 1RM`;
  }
  // latest e1RM vs the median of the previous (up to) 4 sessions — a read that works even when weights keep changing
  let strengthLine = '';
  if(e1s.length>=3){
    const latest = e1s[e1s.length-1];
    const base = median4(e1s.slice(-5,-1).map(x=>x.e1rm));
    const pct = (latest.e1rm/base-1)*100;
    const word = pct>PROGRESS_FLAT_PCT ? 'above' : pct<-PROGRESS_FLAT_PCT ? 'below' : 'in line with';
    strengthLine = `<div class="overload-note-meta" style="margin-top:6px;">Strength (est. 1RM): ~${Math.round(latest.e1rm)} kg &mdash; <span class="${pctClass(pct)}">${fmtSignedPct(pct)}</span> ${word} your previous ${Math.min(4,e1s.length-1)}-session level (${Math.round(base)} kg).</div>`;
  }

  html += `<div class="card">
    <div class="card-title">Snapshot</div>
    <div class="stat-grid">
      <div class="stat-tile">
        <div class="label">Personal best</div>
        <div class="value">${prWeight}<span class="unit">kg</span></div>
        <div class="sub">&times; ${prSet.reps} reps &middot; ${fmtDate(prSet.date)}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Total volume</div>
        <div class="value">${Math.round(totalVolume).toLocaleString()}<span class="unit">kg</span></div>
        <div class="sub">across ${sessionCount} session${sessionCount===1?'':'s'}</div>
      </div>
      ${bestE1 ? `<div class="stat-tile">
        <div class="label">Best est. 1RM</div>
        <div class="value">${Math.round(bestE1.e1rm)}<span class="unit">kg</span></div>
        <div class="sub">${bestE1.set?fmtKg(bestE1.set.weight)+' &times; '+bestE1.set.reps+' &middot; ':''}${fmtDate(bestE1.date)}</div>
      </div>` : `<div class="stat-tile">
        <div class="label">Avg reps / set</div>
        <div class="value">${avgReps}</div>
        <div class="sub">${sets.length} sets logged</div>
      </div>`}
      <div class="stat-tile">
        <div class="label">Trend</div>
        <div class="value" style="font-size:14px;">${e1TrendHtml || trendHtml || '&mdash;'}</div>
        <div class="sub">vs last session</div>
      </div>
    </div>
    ${(progressSI() && window.StrengthUI && !split.archivedAt && ex0 && !ex0.archived && e1s.length>=2) ? `<button class="btn" id="p-open-si" style="width:100%;margin-top:10px;">Full strength analysis &rsaquo;</button>` : ''}
  </div>`;

  // ---- progressive overload ----
  html += `<div class="card overload-card">
    <div class="card-title">Progressive overload</div>
    <div class="overload-main">
      <div>
        <div class="overload-kicker">Same-weight performance</div>
        <div class="overload-title">${overload.currentWeight!=null ? `${fmtRepValue(overload.currentWeight)} kg &times; ${fmtRepValue(overload.currentReps)} reps` : 'Building baseline'}</div>
      </div>
      <div class="overload-status ${overload.statusClass||''}">${overload.title||'Building baseline'}</div>
    </div>
    ${overload.baseline!=null ? `<div class="overload-detail">
      <div class="overload-chip">Baseline: ${fmtRepValue(overload.currentWeight)} kg &times; ${fmtRepValue(overload.baseline)} reps</div>
      <div class="overload-chip">Latest: ${fmtRepValue(overload.currentWeight)} kg &times; ${fmtRepValue(overload.currentReps)} reps</div>
    </div>` : ''}
    ${overload.status==='watch' ? `<div class="overload-progress"><span style="width:${Math.min(100,((overload.followups||0)/3)*100)}%"></span></div>` : ''}
    <div class="overload-note">${String(overload.note||'').split('|').map((part,i)=>i===0 ? `<div class="overload-note-main">${part}</div>` : `<div class="overload-note-meta">${part}</div>`).join('')}</div>
    ${strengthLine}
  </div>`;

  // ---- metric toggle + line chart (top weight & volume per session) ----
  html += `<div class="card">
    <div class="card-title">Session trend</div>
    <div class="segmented" id="p-metric">
      ${hasE1?`<button data-m="e1rm" class="${metric==='e1rm'?'active':''}">Est. 1RM</button>`:''}
      <button data-m="weight" class="${metric==='weight'?'active':''}">Top weight</button>
      <button data-m="volume" class="${metric==='volume'?'active':''}">Volume</button>
      <button data-m="reps" class="${metric==='reps'?'active':''}">Avg reps</button>
    </div>
    ${sessionDates.length>=3?`<div class="segmented" id="p-range" style="margin-top:-6px;">
      ${[['30','1M'],['90','3M'],['180','6M'],['all','All']].map(([v,l])=>`<button data-r="${v}" class="${state.progressRange===v?'active':''}">${l}</button>`).join('')}
    </div>`:''}
    <div class="chart-wrap"><canvas id="chart-line" role="img" aria-label="Line chart of ${metric} over time for ${esc(exList.find(e=>e.id===state.progressExerciseId).name)}">Session trend chart.</canvas></div>
  </div>`;

  // ---- scatter weight vs reps ----
  html += `<div class="card">
    <div class="card-title">Weight vs reps (every set) <span class="card-title-sub">recent = brighter</span></div>
    <div class="chart-wrap"><canvas id="chart-scatter" role="img" aria-label="Scatter plot of weight versus reps for every logged set">Weight vs reps scatter plot.</canvas></div>
  </div>`;

  // ---- avg reps by weight bar ----
  const byWeight = {};
  sets.forEach(s=>{ (byWeight[s.weight]=byWeight[s.weight]||[]).push(s.reps); });
  const weightKeys = Object.keys(byWeight).map(Number).sort((a,b)=>a-b);
  if(weightKeys.length>=2){
    html += `<div class="card">
      <div class="card-title">Average reps by weight used</div>
      <div class="chart-wrap"><canvas id="chart-bar" role="img" aria-label="Bar chart of average reps for each weight used">Average reps by weight bar chart.</canvas></div>
    </div>`;
  }

  // ---- personal records (estimated-1RM bests) ----
  if(e1s.length>=2){
    const prDates = prSessionDates(e1s);
    const prList = prDates.slice(-6).reverse().map(d=>{
      const i = e1s.findIndex(x=>x.date===d); const cur = e1s[i];
      const before = Math.max(...e1s.slice(0,i).map(x=>x.e1rm));
      return {d, cur, gain:(cur.e1rm/before-1)*100};
    });
    const latestDay = dayNumOfDate(e1s[e1s.length-1].date);
    const refDate = prDates.length ? prDates[prDates.length-1] : e1s[0].date;
    const wk = Math.floor((latestDay-dayNumOfDate(refDate))/7);
    let plateau = '';
    if(e1s.length>=4){
      plateau = wk>=6
        ? `No new estimated best for ${wk} weeks before your latest session &mdash; a plateau. Common fixes: a lighter deload week, or changing the rep range.`
        : (prDates.length ? `Last PR was ${wk<1?'in the same week as':wk+' week'+(wk===1?'':'s')+' before'} your latest session.` : '');
    }
    html += `<div class="card">
      <div class="card-title">Personal records <span class="card-title-sub">estimated 1RM</span></div>
      ${prList.length ? prList.map(r=>`<div class="compare-row"><span class="cr-label">${fmtDate(r.d)}</span><span class="cr-val" style="font-size:13px;">${r.cur.set?fmtKg(r.cur.set.weight)+' &times; '+r.cur.set.reps+' &middot; ':''}~${Math.round(r.cur.e1rm)}kg <span class="trend-up" style="font-size:11px;">${fmtSignedPct(r.gain)}</span></span></div>`).join('') : `<p style="font-size:12.5px;color:var(--text-faint);">No PR yet &mdash; a PR is a session whose estimated 1RM beats every earlier session.</p>`}
      ${plateau?`<p class="split-foot${wk>=6?' warn':''}">${plateau}</p>`:''}
    </div>`;
  }

  // ---- best reps at each weight ----
  const bestAtW = {};
  sets.forEach(s=>{ const w=s.weight; if(!bestAtW[w] || s.reps>=bestAtW[w].reps) bestAtW[w]={reps:s.reps, date:s.date, n:0}; });
  sets.forEach(s=>{ bestAtW[s.weight].n++; });
  const bestWeights = Object.keys(bestAtW).map(Number).sort((a,b)=>b-a).slice(0,6);
  if(bestWeights.length>=2){
    html += `<div class="card">
      <div class="card-title">Best reps at each weight <span class="card-title-sub">heaviest first</span></div>
      ${bestWeights.map(w=>`<div class="compare-row"><span class="cr-label">${fmtKg(w)} kg</span><span class="cr-val" style="font-size:13px;">${bestAtW[w].reps} reps <span style="font-size:11px;color:var(--text-faint);">&middot; ${fmtDate(bestAtW[w].date)} &middot; ${bestAtW[w].n} set${bestAtW[w].n===1?'':'s'}</span></span></div>`).join('')}
    </div>`;
  }

  // ---- recent sessions, set by set ----
  const e1ByDateMap = {}; e1s.forEach(x=>{ e1ByDateMap[x.date]=x; });
  html += `<div class="card">
    <div class="card-title">Recent sessions</div>
    ${sessionDates.slice(-6).reverse().map(d=>`<div class="compare-row" style="align-items:flex-start;"><span class="cr-label">${fmtDate(d)}</span><span class="cr-val" style="font-size:12.5px;text-align:right;line-height:1.5;">${setsLabel(sessionsMap[d])}${e1ByDateMap[d]?`<br><span style="font-size:10.5px;color:var(--text-faint);">~${Math.round(e1ByDateMap[d].e1rm)}kg est. 1RM</span>`:''}</span></div>`).join('')}
  </div>`;

  $main.innerHTML = html;
  bindProgressModeSwitcher();
  bindProgressSelectors();

  const searchBox = document.getElementById('p-ex-search');
  if(searchBox) searchBox.oninput = ()=>{
    const q = searchBox.value.trim().toLowerCase(); const sel = document.getElementById('p-exercise');
    const keep = sel.value;
    sel.innerHTML = exList.filter(e=>!q || e.name.toLowerCase().includes(q) || e.id===keep).map(e=>`<option value="${e.id}" ${e.id===keep?'selected':''}>${esc(e.name)}${e.archived?' (archived)':''}</option>`).join('');
  };
  const siBtn = document.getElementById('p-open-si');
  if(siBtn) siBtn.onclick = ()=>{
    try{
      // the Strength dashboard needs its data hooks; set them without drawing the Stats card
      StrengthUI.mountCard(document.createElement('div'), {getData:()=>DB, getSplits:()=>DB.splits.map(sp=>({id:sp.id, name:sp.name, active:!sp.archivedAt, dayIds:[...(sp.dayIds||[]), ...(sp.days||[]).map(d=>d.id)]})), identityKey:exerciseIdentityKey, idbGet, idbSet});
      StrengthUI.open(exerciseIdentityKey(ex0.name));
    }catch(err){ console.warn('Strength dashboard unavailable', err); toast('Strength analysis unavailable'); }
  };
  document.querySelectorAll('#p-range button').forEach(b=> b.onclick = ()=>{ state.progressRange=b.dataset.r; renderProgress(); });

  document.querySelectorAll('#p-metric button').forEach(b=> b.onclick = ()=>{ state.progressMetric=b.dataset.m; renderProgress(); });

  // build datasets
  const e1ByDate = {}; e1s.forEach(x=>{ e1ByDate[x.date]=x; });
  let sessionRows = sessionDates.map(d=>{
    const daySets = sessionsMap[d];
    const workingSets = daySets.filter(isWorkingPerformanceSet);
    return {
      date:d,
      topWeight: workingSets.length ? Math.max(...workingSets.map(s=>Number(s.weight)||0)) : 0,
      volume: workingSets.reduce((a,s)=>a+(Number(s.weight)||0)*(Number(s.reps)||0),0),
      avgReps: workingSets.length ? +(workingSets.reduce((a,s)=>a+(Number(s.reps)||0),0)/workingSets.length).toFixed(1) : 0,
      e1rm: e1ByDate[d] ? Math.round(e1ByDate[d].e1rm*10)/10 : null
    };
  });
  if(state.progressRange!=='all' && sessionRows.length>=3){
    const lim = dayNumOfDate(sessionRows[sessionRows.length-1].date) - Number(state.progressRange);
    const inRange = sessionRows.filter(r=>dayNumOfDate(r.date)>=lim);
    if(inRange.length>=2) sessionRows = inRange;   // too few points in the window: keep everything rather than draw an empty chart
  }
  const metricKey = metric==='e1rm'?'e1rm':metric==='weight'?'topWeight':metric==='volume'?'volume':'avgReps';
  const metricLabel = metric==='e1rm'?'Est. 1RM (kg)':metric==='weight'?'Top weight (kg)':metric==='volume'?'Volume (kg)':'Avg reps';
  const zeroBase = metric==='volume' || metric==='reps';   // weight / 1RM lines must NOT start at zero or a 2.5 kg gain looks flat

  destroyCharts();
  charts.line = new Chart(document.getElementById('chart-line'), {
    type:'line',
    data:{ labels: sessionRows.map(r=>fmtDate(r.date)),
      datasets:[{ label:metricLabel, data: sessionRows.map(r=>r[metricKey]), borderColor:'#E8B32C', backgroundColor:'rgba(232,179,44,0.1)',
        borderWidth:2, pointRadius:4, pointBackgroundColor:'#E8B32C', pointBorderColor:'#1B1E23', pointBorderWidth:2, fill:zeroBase, tension:0.25, spanGaps:true }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'} },
               y:{ ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'}, beginAtZero:zeroBase, grace: zeroBase ? 0 : '12%' } } }
  });

  maxifyChart(charts.line, {title:'Progress — '+metricLabel, yName:metricLabel, yUnit: metric==='reps'?'':' kg'});
  charts.scatter = new Chart(document.getElementById('chart-scatter'), {
    type:'scatter',
    data:{ datasets:[{ label:'Sets', data: sets.map(s=>({x:s.weight,y:s.reps,d:s.date})),
      // older sets fade to grey, recent sets glow accent — so you can see whether you're moving up and to the right over time
      backgroundColor: sets.map((s,i)=>{ const t = sets.length>1 ? i/(sets.length-1) : 1; const m=(a,b)=>Math.round(a+(b-a)*t); return `rgba(${m(93,232)},${m(99,179)},${m(107,44)},${(0.45+0.55*t).toFixed(2)})`; }),
      borderColor:'rgba(0,0,0,0)', pointRadius:5, pointHoverRadius:6 }]},
    options:{ responsive:true, maintainAspectRatio:false, layout:{padding:12},
      plugins:{ legend:{display:false} },
      scales:{ x:{ title:{display:true,text:'Weight (kg)',color:'#9A9FA6',font:{size:11}}, ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'} },
               y:{ title:{display:true,text:'Reps',color:'#9A9FA6',font:{size:11}}, ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'}, beginAtZero:true } } }
  });

  maxifyChart(charts.scatter, {title:'Weight vs reps (every set)', xName:'Weight', xUnit:' kg', yName:'Reps', yUnit:''});

  if(weightKeys.length>=2){
    const avgRepsByWeight = weightKeys.map(w=> +(byWeight[w].reduce((a,b)=>a+b,0)/byWeight[w].length).toFixed(1));
    charts.bar = new Chart(document.getElementById('chart-bar'), {
      type:'bar',
      data:{ labels: weightKeys.map(w=>w+'kg'), datasets:[{ label:'Avg reps', data: avgRepsByWeight, backgroundColor:'#6FA97B', borderRadius:4, maxBarThickness:28 }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{display:false} },
                 y:{ ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'}, beginAtZero:true } } }
    });
    maxifyChart(charts.bar, {title:'Average reps by weight used', xName:'Weight', yName:'Avg reps', yUnit:'', counts: weightKeys.map(w=>byWeight[w].length)});
  }
}

/* ============ PROGRESS: DAY / SESSION REPORT ============ */
function progressScoreRingSvg(pct){
  const r = 32, c = 2*Math.PI*r;
  const off = c * (1 - Math.max(0,Math.min(100,pct))/100);
  const color = pct>=75 ? 'var(--good)' : pct>=45 ? 'var(--accent)' : 'var(--rust)';
  return `<svg viewBox="0 0 78 78">
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="7"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}
/* ============ SHARED e1RM HELPERS (Progress › Exercise + Day) ============
   One estimated-1RM number per session folds weight AND reps together, so a heavier-but-fewer-reps
   session and a lighter-but-more-reps session can be compared (load progression and rep progression
   both drive adaptation — see sources in the change notes). Uses the Strength Intelligence engine when
   present (blended Epley/Brzycki/Lombardi, rep-range weighted, typo-filtered), else plain Epley. */
const PROGRESS_FLAT_PCT = 1.5; // changes smaller than this are treated as "same" (session-to-session noise is ~1% even in controlled testing)
function progressSI(){ return (window.StrengthIntelligence && typeof StrengthIntelligence.getExerciseHistory==='function') ? window.StrengthIntelligence : null; }
function pooledLiftData(ex){
  const ids = new Set(matchingExerciseIds(ex));
  return { exercises: DB.exercises.filter(e=>ids.has(e.id)), sets: DB.sets.filter(s=>ids.has(s.exerciseId)) };
}
function dayNumOfDate(d){ return Math.floor(Date.parse(d+'T00:00:00Z')/864e5); }
// Sessions (one per date) with an e1RM, oldest -> newest. Each: {date, day, e1rm, set:{weight,reps}}
function e1rmSessions(ex){
  if(!ex) return [];
  const data = pooledLiftData(ex);
  const SI = progressSI();
  if(SI){
    try{
      const h = SI.getExerciseHistory(data, exerciseIdentityKey(ex.name), {identityKey: exerciseIdentityKey});
      return (h.sessions||[]).filter(s=>!s.anomalous && s.e1rm!=null).map(s=>({date:s.date, day:s.day, e1rm:s.e1rm, set: s.e1rmSet ? {weight:s.e1rmSet.weight, reps:s.e1rmSet.reps} : null}));
    }catch(err){ console.warn('e1RM engine failed, using fallback', err); }
  }
  const byDate = {};
  data.sets.filter(isWorkingPerformanceSet).forEach(s=>{ (byDate[s.date]=byDate[s.date]||[]).push(s); });
  return Object.keys(byDate).sort().map(date=>{
    const ss = byDate[date]; const pool = ss.some(s=>s.reps<=12) ? ss.filter(s=>s.reps<=12) : ss;
    let best = pool[0]; pool.forEach(s=>{ if(s.weight*(1+s.reps/30) > best.weight*(1+best.reps/30)) best = s; });
    return {date, day:dayNumOfDate(date), e1rm: best.weight*(1+best.reps/30), set:{weight:best.weight, reps:best.reps}};
  });
}
function fmtKg(v){ return (Math.round(v*10)/10).toString(); }
function fmtSignedPct(v){ return (v>0?'+':'')+(Math.round(v*10)/10)+'%'; }
// A session is a PR when its e1RM is strictly higher than every EARLIER session. First-ever session is a baseline, not a PR.
function prSessionDates(sessions){
  const out = []; let run = null;
  sessions.forEach((s,i)=>{ if(i>0 && run!=null && s.e1rm>run) out.push(s.date); if(run==null || s.e1rm>run) run = s.e1rm; });
  return out;
}
function setsLabel(sets){
  // "60 × 8, 8, 7 · 70 × 5"
  const parts = []; let curW = null, reps = [];
  sets.forEach(s=>{
    const w = Number(s.weight)||0;
    if(curW===null || w!==curW){ if(curW!==null) parts.push(fmtKg(curW)+' &times; '+reps.join(', ')); curW = w; reps = []; }
    reps.push(Number(s.reps)||0);
  });
  if(curW!==null) parts.push((curW>0?fmtKg(curW):'BW')+' &times; '+reps.join(', '));
  return parts.join(' &middot; ').replace(/^BW/,'BW');
}

/* ============ PROGRESS › DAY ============ */
function daySessionsList(){
  // One session = one split-day on one date. (Previously: everything logged on a calendar date was merged.)
  const map = new Map();
  DB.sets.forEach(s=>{
    const ex = exerciseById(s.exerciseId); if(!ex || !s.date || !isCountedLoggedSet(s)) return;
    const k = ex.dayId+'|'+s.date;
    if(!map.has(k)) map.set(k, {key:k, dayId:ex.dayId, date:s.date, sets:[]});
    map.get(k).sets.push(s);
  });
  const out = [];
  map.forEach(se=>{
    const day = dayById(se.dayId);
    const split = DB.splits.find(sp=>(sp.days||[]).some(d=>d.id===se.dayId)) || DB.splits.find(sp=>(sp.dayIds||[]).includes(se.dayId)) || null;
    se.dayName = day ? day.name : 'Session';
    se.splitName = split ? split.name : '';
    se.sets.sort((a,b)=>setSortValue(a)-setSortValue(b));
    se.work = se.sets.filter(s=>isWorkingSet(s) && Number(s.reps)>0);
    se.volume = se.work.reduce((a,s)=>a+(Number(s.weight)||0)*(Number(s.reps)||0),0);
    se.reps = se.work.reduce((a,s)=>a+(Number(s.reps)||0),0);
    out.push(se);
  });
  return out.sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
}
function renderProgressDayMode(){

    </div>

  // ---- exercise breakdown card ----

    ${rows.map(r=>{
      const wl = w => Number(w)>0 ? fmtKg(w)+'kg' : 'BW';

      </div>`;
    }).join('')}
    <p class="split-foot">Arrows compare estimated 1RM (weight and reps together), so lifting more weight for fewer reps or the reverse is judged fairly. Changes under &plusmn;${PROGRESS_FLAT_PCT}% count as &ldquo;same&rdquo;. PR = e1RM above every earlier session of that lift.</p>
  </div>`;

  // ---- muscle distribution: share of volume, with change vs last time ----
  const share = se=>{

/* ============ PROGRESS: SPLIT COMPARISON REPORT ============ */
function exercisesOfSplit(split){
  const dayIds = new Set([...(split.dayIds||[]), ...(split.days||[]).map(d=>d.id)]);
  return DB.exercises.filter(e=> e.splitId===split.id || dayIds.has(e.dayId));
}
function setsOfSplit(split){
  const exIds = new Set(exercisesOfSplit(split).map(e=>e.id));
  return DB.sets.filter(s=>exIds.has(s.exerciseId));
}
/* ============ PROGRESS › SPLIT COMPARISON ============
   Goal: answer "which split made me stronger?" fairly.
   - Everything is normalised per week / per session (a 6-month split must not beat a 3-week one just by being longer).
   - Strength progress uses estimated 1RM (Strength Intelligence engine) so weight AND reps both count.
   - The chart lines up both splits by "weeks since the lift started in that split", indexed to 100 at the start. */
function splitDayNum(d){ return Math.floor(Date.parse(d+'T00:00:00Z')/864e5); }
function splitSign(v, d){ const n=Number(v); return (n>0?'+':'')+n.toFixed(d==null?1:d); }
function splitSI(){ return (window.StrengthIntelligence && typeof StrengthIntelligence.getExerciseHistory==='function') ? window.StrengthIntelligence : null; }

// e1RM history of one lift (by identity key) for a given data scope. Anomalous / unusable sessions are dropped.
function splitLiftSessions(data, key){
  const SI = splitSI(); if(!SI) return [];
  try{
    const h = SI.getExerciseHistory(data, key, {identityKey: exerciseIdentityKey});
    return (h.sessions||[]).filter(s=>!s.anomalous && s.e1rm!=null);
  }catch(err){ console.warn('Split lift history failed', err); return []; }
}
// Strength gain over a split for one lift: compares the first vs last session(s), returns % and %/week.
function splitLiftGain(sessions){
  const n = sessions.length;
  if(n<3) return null;
  const k = n>=6 ? 2 : 1;
  const first = sessions.slice(0,k), last = sessions.slice(-k);
  const avg = (arr,f)=>arr.reduce((a,x)=>a+f(x),0)/arr.length;
  const e0 = avg(first,s=>s.e1rm), e1 = avg(last,s=>s.e1rm);
  const weeks = (avg(last,s=>s.day)-avg(first,s=>s.day))/7;
  if(!(e0>0) || weeks<1) return null;
  const pct = (e1/e0-1)*100;
  return { pct, rate: pct/weeks, weeks, e0, e1, n, baseline:e0 };
}

function buildSplitReport(split, allHistFor){
  const exs = exercisesOfSplit(split);
  const sets = setsOfSplit(split).filter(isCountedLoggedSet);
  const dates = [...new Set(sets.map(s=>s.date))].sort();
  const n = dates.length;
  const spanDays = n ? splitDayNum(dates[n-1])-splitDayNum(dates[0])+1 : 0;
  const weeks = n ? Math.max(1, spanDays/7) : 0;
  const perf = sets.filter(isWorkingPerformanceSet);
  const volume = perf.reduce((a,s)=>a+s.weight*s.reps,0);
  const workingSets = sets.filter(isWorkingSet).length;

  // per-lift e1RM sessions inside this split (pooled across days by identity key)
  const data = {exercises: exs, sets: setsOfSplit(split)};
  const keys = [...new Set(exs.map(e=>exerciseIdentityKey(e.name)).filter(Boolean))];
  const lifts = new Map();
  keys.forEach(k=>{ const sessions = splitLiftSessions(data, k); lifts.set(k, {sessions, gain: splitLiftGain(sessions)}); });

  // PRs set during this split: a session whose e1RM beat every earlier session of that lift (any split). First-ever session isn't a PR.
  let prs = 0;
  lifts.forEach((L,k)=>{
    const all = allHistFor(k);
    L.sessions.forEach(s=>{
      let prior = null;
      all.forEach(a=>{ if(a.day < s.day && (prior==null || a.e1rm>prior)) prior = a.e1rm; });
      if(prior!=null && s.e1rm > prior) prs++;
    });
  });

  const muscleVol = {};
  perf.forEach(s=>{ const ex=exerciseById(s.exerciseId); if(!ex) return; const g=classifyExercise(ex.name); if(g) muscleVol[g]=(muscleVol[g]||0)+s.weight*s.reps; });

  return { split, name: split.name, exs, sets, perf, dates, sessions:n, weeks, volume, workingSets, keys, lifts, prs, muscleVol,
    sessPerWeek: n>=2 ? n/weeks : null,
    setsPerSession: n ? workingSets/n : null,
    volPerSession: n ? volume/n : null,
    prsPer4: n>=2 ? prs/weeks*4 : null,
    short: n<3 || weeks<2 };
}

function renderProgressSplitMode(){
  setHeader('Progress', 'Split comparison', null, null);
  destroyCharts(); // clear any charts left over from another Progress mode
  let html = buildProgressModeSwitcherHtml();

  if(DB.splits.length<2){
    html += `<div class="empty"><p>Split comparison needs at least two splits. Create another split to unlock this report.</p></div>`;
    $main.innerHTML = html; bindProgressModeSwitcher(); return;
  }

  const sortedSplits = DB.splits.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(!state.progressSplitAId || !DB.splits.some(s=>s.id===state.progressSplitAId)) state.progressSplitAId = sortedSplits[0].id;
  if(!state.progressSplitBId || !DB.splits.some(s=>s.id===state.progressSplitBId) || state.progressSplitBId===state.progressSplitAId){
    state.progressSplitBId = (sortedSplits.find(s=>s.id!==state.progressSplitAId) || sortedSplits[1]).id;
  }
  const splitA = splitById(state.progressSplitAId);
  const splitB = splitById(state.progressSplitBId);

  const bindSelectors = ()=>{
    document.getElementById('p-splitA').onchange = e=>{ state.progressSplitAId=e.target.value; if(state.progressSplitAId===state.progressSplitBId) state.progressSplitBId=null; render(); };
    document.getElementById('p-splitB').onchange = e=>{ state.progressSplitBId=e.target.value; if(state.progressSplitBId===state.progressSplitAId) state.progressSplitAId=null; render(); };
  };

  html += `<div class="card">
    <div class="card-title">Comparing</div>
    <div class="split-vs-bar">
      <select id="p-splitA">${sortedSplits.map(s=>`<option value="${s.id}" ${s.id===splitA.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <span class="split-vs-x">vs</span>
      <select id="p-splitB">${sortedSplits.map(s=>`<option value="${s.id}" ${s.id===splitB.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    </div>
  </div>`;

  // all-history e1RM per lift (every split pooled) — only used to decide what counts as a PR
  const allData = {exercises: DB.exercises, sets: DB.sets};
  const allCache = new Map();
  const allHistFor = k=>{ if(!allCache.has(k)) allCache.set(k, splitLiftSessions(allData, k)); return allCache.get(k); };

  const rA = buildSplitReport(splitA, allHistFor);
  const rB = buildSplitReport(splitB, allHistFor);

  if(rA.sets.length===0 && rB.sets.length===0){
    html += `<div class="empty"><p>Neither split has any logged sets yet, so there's nothing to compare.</p></div>`;
    $main.innerHTML = html; bindProgressModeSwitcher(); bindSelectors();
    return;
  }

  const fmtN = n => Math.round(n).toLocaleString();
  const dash = '&mdash;';

  // ---- shared lifts (same exercise identity in both splits) ----
  const sharedKeys = rA.keys.filter(k=>rB.keys.includes(k));
  // fair strength comparison: only lifts with a measurable gain in BOTH splits
  const gainKeys = sharedKeys.filter(k=>rA.lifts.get(k).gain && rB.lifts.get(k).gain);
  const median = arr=>{ const a=arr.slice().sort((x,y)=>x-y); const m=a.length>>1; return a.length ? (a.length%2?a[m]:(a[m-1]+a[m])/2) : null; };
  const gainA = gainKeys.length ? median(gainKeys.map(k=>rA.lifts.get(k).gain.rate)) : null;
  const gainB = gainKeys.length ? median(gainKeys.map(k=>rB.lifts.get(k).gain.rate)) : null;

  // ---- 1. verdict ----
  let verdict;
  if(gainA!=null && gainB!=null){
    const diff = gainA-gainB;
    const lifts = `${gainKeys.length} shared lift${gainKeys.length===1?'':'s'}`;
    if(Math.abs(diff)<0.25){
      verdict = `<b>Similar strength progress.</b> <span class="va">${esc(rA.name)} ${splitSign(gainA)}%/wk</span> vs <span class="vb">${esc(rB.name)} ${splitSign(gainB)}%/wk</span> across ${lifts}.`;
    } else {
      const w = diff>0 ? rA : rB, wv = diff>0 ? gainA : gainB, lv = diff>0 ? gainB : gainA, cls = diff>0?'va':'vb';
      verdict = `<b><span class="${cls}">${esc(w.name)}</span> made you stronger faster.</b> ${splitSign(wv)}%/wk vs ${splitSign(lv)}%/wk (median e1RM change across ${lifts}).`;
    }
    if(gainKeys.length<2) verdict += ` <span class="vnote">Based on a single lift — treat as a hint.</span>`;
  } else if(!splitSI()){
    verdict = `<b>Strength comparison unavailable.</b> <span class="vnote">The strength engine did not load.</span>`;
  } else {
    verdict = `<b>Not enough shared-lift history yet.</b> <span class="vnote">A strength verdict needs the same lift logged on 3+ days in both splits.</span>`;
  }
  html += `<div class="card split-verdict">
    <div class="card-title">Verdict</div>
    <div class="split-verdict-text">${verdict}</div>
  </div>`;

  // ---- 2. fair, per-week metrics ----
  const hi = (a,b,tol)=> (a==null||b==null||Math.abs(a-b)<=tol) ? ['',''] : (a>b ? ['win',''] : ['','win']);
  const row = (label, a, b, win, subA, subB)=>`<div class="split-metric-row"><div class="sm-label">${label}</div>
      <div class="sm-a ${win[0]}">${a}${subA?`<small>${subA}</small>`:''}</div>
      <div class="sm-b ${win[1]} ${win[1]?'win-b':''}">${b}${subB?`<small>${subB}</small>`:''}</div></div>`;
  const f1 = v=> v==null ? dash : (Math.round(v*10)/10).toString();
  const lenTxt = r=> r.sessions ? (Math.round(r.weeks*10)/10)+' wk' : dash;
  html += `<div class="card">
    <div class="card-title">Per week &amp; per session</div>
    <div class="split-legend">
      <span><span class="dot" style="background:var(--accent);"></span>${esc(rA.name)}</span>
      <span><span class="dot" style="background:var(--rust);"></span>${esc(rB.name)}</span>
    </div>
    ${row('Length', lenTxt(rA), lenTxt(rB), ['',''], rA.sessions+' sessions', rB.sessions+' sessions')}
    ${row('Sessions / wk', f1(rA.sessPerWeek), f1(rB.sessPerWeek), hi(rA.sessPerWeek,rB.sessPerWeek,0.25))}
    ${row('Sets / session', f1(rA.setsPerSession), f1(rB.setsPerSession), ['',''])}
    ${row('Volume / session', rA.volPerSession==null?dash:fmtN(rA.volPerSession)+'kg', rB.volPerSession==null?dash:fmtN(rB.volPerSession)+'kg', ['',''])}
    ${row('Strength gain', gainA==null?dash:splitSign(gainA)+'%/wk', gainB==null?dash:splitSign(gainB)+'%/wk', hi(gainA,gainB,0.25), gainA==null?'':gainKeys.length+' shared lifts', gainB==null?'':gainKeys.length+' shared lifts')}
    ${row('PRs / 4 wks', f1(rA.prsPer4), f1(rB.prsPer4), hi(rA.prsPer4,rB.prsPer4,0.25), rA.sessions?rA.prs+' total':'', rB.sessions?rB.prs+' total':'')}
    <p class="split-foot">Per-week numbers remove the advantage of simply running a split for longer. PR = a session whose estimated 1RM beat every earlier session of that lift.</p>
    ${(rA.short||rB.short) ? `<p class="split-foot warn">${[rA,rB].filter(r=>r.short).map(r=>esc(r.name)).join(' and ')} ${[rA,rB].filter(r=>r.short).length>1?'have':'has'} a short history (under 3 sessions or 2 weeks) — its numbers are rough.</p>` : ''}
  </div>`;

  // ---- 3. muscle focus: share of volume, shared scale ----
  const totA = Object.values(rA.muscleVol).reduce((a,b)=>a+b,0), totB = Object.values(rB.muscleVol).reduce((a,b)=>a+b,0);
  const shareOf = (r,tot,g)=> tot ? (r.muscleVol[g]||0)/tot*100 : 0;
  const muscleKeys = STATS_GROUPS.filter(g=>rA.muscleVol[g] || rB.muscleVol[g]);
  let shiftNote = '';
  if(muscleKeys.length && totA && totB){
    let best=null;
    muscleKeys.forEach(g=>{ const d = shareOf(rB,totB,g)-shareOf(rA,totA,g); if(!best || Math.abs(d)>Math.abs(best.d)) best={g,d}; });
    if(best && Math.abs(best.d)>=3) shiftNote = `<p class="split-foot">Biggest shift: <b>${STATS_LABELS[best.g].toLowerCase()}</b> gets ${Math.abs(Math.round(best.d))} points ${best.d>0?'more':'less'} of your volume in ${esc(rB.name)} than in ${esc(rA.name)}.</p>`;
  }
  const maxShare = Math.max(1, ...muscleKeys.map(g=>Math.max(shareOf(rA,totA,g), shareOf(rB,totB,g))));
  html += `<div class="card">
    <div class="card-title">Muscle focus <span class="card-title-sub">share of volume</span></div>
    ${muscleKeys.length ? muscleKeys.map(g=>{
      const a = shareOf(rA,totA,g), b = shareOf(rB,totB,g);
      return `<div class="muscle-bar-row">
        <div class="mb-label">${STATS_LABELS[g]}</div>
        <div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:${Math.round(a/maxShare*100)}%;background:var(--accent);"></div></div>
        <div class="muscle-bar-val">${Math.round(a)}%</div>
      </div>
      <div class="muscle-bar-row" style="margin-top:-2px;">
        <div class="mb-label"></div>
        <div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:${Math.round(b/maxShare*100)}%;background:var(--rust);"></div></div>
        <div class="muscle-bar-val">${Math.round(b)}%</div>
      </div>`;
    }).join('') + shiftNote : `<p style="font-size:12.5px;color:var(--text-faint);">No classified muscle-group volume to show for either split yet.</p>`}
  </div>`;

  // ---- 4. progression chart (e1RM index by week  |  weight → reps) ----
  // Lifts shared by both splits that actually have logged working sets in both, best-populated first.
  const liftNameOf = (r,k)=>{ const ex = r.exs.find(e=>exerciseIdentityKey(e.name)===k); return ex ? ex.name : k; };
  const setsOfLift = (r,k)=> r.perf.filter(s=>{ const ex=exerciseById(s.exerciseId); return ex && exerciseIdentityKey(ex.name)===k; });
  const chartKeys = sharedKeys
    .map(k=>({k, a:setsOfLift(rA,k), b:setsOfLift(rB,k)}))
    .filter(x=>x.a.length && x.b.length)
    .sort((x,y)=> Math.min(y.a.length,y.b.length)-Math.min(x.a.length,x.b.length));
  const chartKeyList = chartKeys.map(x=>x.k);
  if(!state.progressSplitSharedKey || !chartKeyList.includes(state.progressSplitSharedKey)) state.progressSplitSharedKey = chartKeyList[0] || null;
  const view = (state.progressSplitChartView==='wxr' || !splitSI()) ? 'wxr' : 'strength';

  const exSummary = (r,k)=>{
    const L = r.lifts.get(k); const g = L && L.gain;
    const sess = L ? L.sessions.length : 0;
    if(!g) return `${sess} usable session${sess===1?'':'s'} &middot; <span class="vnote">needs 3+ for a trend</span>`;
    return `${Math.round(g.e0)} &rarr; ${Math.round(g.e1)} kg e1RM &middot; <b>${splitSign(g.pct)}%</b> (${splitSign(g.rate)}%/wk) &middot; ${sess} sessions`;
  };

  if(chartKeyList.length){
    const k = state.progressSplitSharedKey;
    const opts = chartKeys.map(x=>`<option value="${esc(x.k)}" ${x.k===k?'selected':''}>${esc(liftNameOf(rA,x.k))} (${x.a.length} / ${x.b.length} sets)</option>`).join('');
    html += `<div class="card">
      <div class="card-title">Same-lift progression</div>
      <select id="p-shared-ex" style="margin-bottom:10px;">${opts}</select>
      <div class="segmented" id="p-split-view">
        ${splitSI() ? `<button data-v="strength" class="${view==='strength'?'active':''}">Strength by week</button>` : ''}
        <button data-v="wxr" class="${view==='wxr'?'active':''}">Weight &rarr; reps</button>
      </div>
      <div class="chart-wrap"><canvas id="chart-split-shared" role="img" aria-label="Comparison of this lift between the two splits">Shared lift comparison chart.</canvas></div>
      <p class="split-foot" id="p-split-chart-hint"></p>
      <div id="p-shared-ex-note"></div>
    </div>`;
  } else {
    html += `<div class="card"><div class="card-title">Same-lift progression</div>
      <p style="font-size:12.5px;color:var(--text-faint);">${sharedKeys.length ? 'No shared lift has logged sets in both splits yet.' : 'These splits have no exercise in common, so there is no lift to compare directly.'}</p></div>`;
  }

  // ---- 5. exercise overlap, one line (+ optional detail) ----
  const nameByKey = (r,k)=>liftNameOf(r,k);
  const onlyA = rA.keys.filter(k=>!rB.keys.includes(k)), onlyB = rB.keys.filter(k=>!rA.keys.includes(k));
  html += `<div class="card">
    <div class="card-title">Exercise overlap</div>
    <p class="split-overlap"><b>${sharedKeys.length}</b> shared &middot; <b>${onlyA.length}</b> only in ${esc(rA.name)} &middot; <b>${onlyB.length}</b> only in ${esc(rB.name)}</p>
    ${(sharedKeys.length||onlyA.length||onlyB.length) ? `<details class="split-details"><summary>Show exercises</summary>
      ${sharedKeys.length?`<p class="split-foot">Shared</p><div class="shared-ex-chip-list">${sharedKeys.map(k=>`<span class="ex-chip">${esc(nameByKey(rA,k))}</span>`).join('')}</div>`:''}
      ${onlyA.length?`<p class="split-foot">Only in ${esc(rA.name)}</p><div class="uniq-ex-chip-list">${onlyA.map(k=>`<span class="ex-chip">${esc(nameByKey(rA,k))}</span>`).join('')}</div>`:''}
      ${onlyB.length?`<p class="split-foot">Only in ${esc(rB.name)}</p><div class="uniq-ex-chip-list">${onlyB.map(k=>`<span class="ex-chip">${esc(nameByKey(rB,k))}</span>`).join('')}</div>`:''}
    </details>` : ''}
  </div>`;

  $main.innerHTML = html;
  bindProgressModeSwitcher();
  bindSelectors();
  const sharedSel = document.getElementById('p-shared-ex');
  if(sharedSel) sharedSel.onchange = e=>{ state.progressSplitSharedKey=e.target.value; render(); };
  document.querySelectorAll('#p-split-view [data-v]').forEach(b=> b.onclick = ()=>{ state.progressSplitChartView=b.dataset.v; render(); });

  if(!chartKeyList.length) return;
  const key = state.progressSplitSharedKey;
  const liftName = liftNameOf(rA,key);
  const note = document.getElementById('p-shared-ex-note');
  const hint = document.getElementById('p-split-chart-hint');
  const cOpts = (xTitle, yTitle, extra)=>({ responsive:true, maintainAspectRatio:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{display:true, labels:{color:'#9A9FA6',font:{size:10.5}}}, tooltip: extra },
    scales:{ x:{ title:{display:true,text:xTitle,color:'#9A9FA6',font:{size:11}}, ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'} },
             y:{ title:{display:true,text:yTitle,color:'#9A9FA6',font:{size:11}}, ticks:{color:'#9A9FA6',font:{size:10.5}}, grid:{color:'#2E333A'} } } });
  const ds = (label, data, color, fill, raw)=>({ label, data, raw, borderColor:color, backgroundColor:fill, borderWidth:2, pointRadius:3, pointHoverRadius:5, spanGaps:true, tension:0.25 });

  if(view==='strength'){
    // x = weeks since this lift started in THAT split, y = e1RM indexed to 100 at the start
    const build = r=>{
      const L = r.lifts.get(key); const ss = L ? L.sessions : [];
      if(!ss.length) return {pts:[], base:null};
      const k0 = ss.length>=6 ? 2 : 1;
      const base = ss.slice(0,k0).reduce((a,s)=>a+s.e1rm,0)/k0;
      const day0 = ss[0].day;
      const byWeek = {};
      ss.forEach(s=>{ const w=Math.floor((s.day-day0)/7); (byWeek[w]=byWeek[w]||[]).push(s.e1rm); });
      return {pts: byWeek, base};
    };
    const bA = build(rA), bB = build(rB);
    const maxW = Math.max(-1, ...Object.keys(bA.pts).map(Number), ...Object.keys(bB.pts).map(Number));
    const weeks = Array.from({length:maxW+1}, (_,i)=>i);
    const line = b=>({
      idx: weeks.map(w=> b.pts[w] ? Math.round(b.pts[w].reduce((a,x)=>a+x,0)/b.pts[w].length/b.base*1000)/10 : null),
      raw: weeks.map(w=> b.pts[w] ? Math.round(b.pts[w].reduce((a,x)=>a+x,0)/b.pts[w].length*10)/10 : null)
    });
    const lA = line(bA), lB = line(bB);
    if(maxW<0 || (lA.idx.filter(v=>v!=null).length<2 && lB.idx.filter(v=>v!=null).length<2)){
      note.innerHTML = `<p style="font-size:12.5px;color:var(--text-faint);margin-top:8px;">Not enough sessions of this lift yet for a strength curve — switch to Weight &rarr; reps.</p>`;
    } else {
      charts.splitShared = new Chart(document.getElementById('chart-split-shared'), {
        type:'line',
        data:{ labels: weeks.map(w=>'Wk '+(w+1)), datasets:[
          ds(esc(rA.name), lA.idx, '#E8B32C', 'rgba(232,179,44,0.1)', lA.raw),
          ds(esc(rB.name), lB.idx, '#C1543A', 'rgba(193,84,58,0.1)', lB.raw) ]},
        options: cOpts('Weeks since this lift started in each split', 'Strength index (start = 100)', {
          callbacks:{ label:c=> c.parsed.y==null ? '' : `${c.dataset.label}: ${c.parsed.y}  (${(c.dataset.raw||[])[c.dataIndex]} kg e1RM)` } })
      });
      maxifyChart(charts.splitShared, {title:liftName+' — strength index by week', yName:'Strength index', yUnit:''});
      hint.innerHTML = `Each line starts at 100 so a stronger starting point doesn&rsquo;t hide the pace of progress. Estimated 1RM combines weight and reps.`;
    }
    note.innerHTML = `<div class="split-lift-note"><div><span class="dot" style="background:var(--accent);"></span><b>${esc(rA.name)}</b><br>${exSummary(rA,key)}</div>
      <div><span class="dot" style="background:var(--rust);"></span><b>${esc(rB.name)}</b><br>${exSummary(rB,key)}</div></div>` + note.innerHTML;
  } else {
    // weight -> average reps at that weight, one line per split
    const avgAt = sets=>{ const m={}; sets.forEach(s=>{ (m[s.weight]=m[s.weight]||[]).push(s.reps); }); return m; };
    const sA = setsOfLift(rA,key), sB = setsOfLift(rB,key);
    const mA = avgAt(sA), mB = avgAt(sB);
    const wts = [...new Set([...Object.keys(mA), ...Object.keys(mB)].map(Number))].sort((a,b)=>a-b);
    const mean = a=>a.reduce((x,y)=>x+y,0)/a.length;
    charts.splitShared = new Chart(document.getElementById('chart-split-shared'), {
      type:'line',
      data:{ labels: wts.map(w=>String(Math.round(w*100)/100)), datasets:[
        ds(esc(rA.name), wts.map(w=> mA[w] ? Math.round(mean(mA[w])*10)/10 : null), '#E8B32C', 'rgba(232,179,44,0.1)', wts.map(w=> mA[w] ? mA[w].length : 0)),
        ds(esc(rB.name), wts.map(w=> mB[w] ? Math.round(mean(mB[w])*10)/10 : null), '#C1543A', 'rgba(193,84,58,0.1)', wts.map(w=> mB[w] ? mB[w].length : 0)) ]},
      options: cOpts('Weight (kg)', 'Average reps', {
        callbacks:{ title:items=> items.length ? items[0].label+' kg' : '', label:c=> c.parsed.y==null ? '' : `${c.dataset.label}: ${c.parsed.y} reps (${c.dataset.raw[c.dataIndex]} set${c.dataset.raw[c.dataIndex]===1?'':'s'})` } })
    });
    maxifyChart(charts.splitShared, {title:liftName+' — average reps at each weight', xName:'Weight', xUnit:' kg', yName:'Avg reps', yUnit:''});
    hint.innerHTML = `Higher is better at the same weight. Gaps mean that split never used that load.`;

    // headline: heaviest weight both splits actually trained
    const common = wts.filter(w=>mA[w] && mB[w]);
    const strong = common.filter(w=>mA[w].length>=2 && mB[w].length>=2);
    const pick = (strong.length?strong:common).slice(-1)[0];
    if(pick!=null){
      const a = mean(mA[pick]), b = mean(mB[pick]);
      const d = a-b;
      note.innerHTML = `<div class="split-lift-note single"><div>At <b>${Math.round(pick*100)/100} kg</b> (heaviest load both splits used): <span class="va">${esc(rA.name)} ${a.toFixed(1)} reps</span> vs <span class="vb">${esc(rB.name)} ${b.toFixed(1)} reps</span>${Math.abs(d)>=0.5?` &mdash; <b>${d>0?esc(rA.name):esc(rB.name)}</b> ahead by ${Math.abs(d).toFixed(1)}`:' &mdash; about the same'}.</div></div>`;
    } else {
      note.innerHTML = `<p style="font-size:12.5px;color:var(--text-faint);margin-top:8px;">The two splits never used the same weight for this lift, so reps can&rsquo;t be compared directly. Try Strength by week.</p>`;
    }
  }
}

function bindProgressSelectors(){
  const ps = document.getElementById('p-split');
  if(ps) ps.onchange = e=>{ state.progressSplitId=e.target.value; state.progressExerciseId=null; render(); };
  const pe = document.getElementById('p-exercise');
  if(pe) pe.onchange = e=>{ state.progressExerciseId=e.target.value; render(); };
}

function destroyCharts(){ Object.values(charts).forEach(c=>{ if(c) c.destroy(); }); charts={}; }
// Make a small Progress chart double-tap / expand-button maximizable (see chart-max.js).
// The pristine user config is snapshotted as JSON; the full-screen chart is rebuilt from it.
function maxifyChart(chart, meta){
  if(!chart || !window.ChartMax) return;
  let json=null, err=null;
  try{
    const cfg = chart.config && (chart.config._config || chart.config);
    json = JSON.stringify({type:cfg.type, data:cfg.data, options:cfg.options});
  }catch(e){ err=e; console.warn('Chart snapshot failed', e); }
  try{ ChartMax.attach(chart.canvas, json, meta||{}, err); }catch(e){ console.warn('Chart maximize unavailable', e); }
}

let appBackGuardReady=false;
let lastLeaveWarningAt=0;
const LEAVE_CONFIRM_WINDOW_MS=2000;
function installBackGuard(){
  // One entry per tab, so back can step through in-app tab history before ever reaching
  // this guard; see goToTab. This first entry represents the tab the app opened on.
  history.pushState({ppTab:state.tab}, '', location.href);
  appBackGuardReady = true;
  window.addEventListener('popstate', e=>{
    if(window.ChartMax && ChartMax.isOpen()){
      ChartMax.close();
      history.pushState({ppTab:state.tab}, '', location.href);
      return;
    }
    if(window.StrengthUI && StrengthUI.isOpen()){
      StrengthUI.close();
      history.pushState({ppTab:state.tab}, '', location.href);
      return;
    }
    const fsOverlay = document.getElementById('stats3d-fs-overlay');
    if(fsOverlay && fsOverlay.classList.contains('open')){
      exitStats3DFullscreen();
      history.pushState({ppTab:state.tab}, '', location.href);
      return;
    }
    if(document.querySelector('.modal-overlay') || document.getElementById('gallery-max-overlay')){
      closeModal(); closeGalleryMaximize();
      history.pushState({ppTab:state.tab}, '', location.href);
      return;
    }
    if(spIsOpen()){
      history.pushState({ppTab:state.tab}, '', location.href);
      closeSplitPreview(false);
      return;
    }
    const s = e.state;
    if(s && s.ppTab){
      // Landed on one of our own tab-history entries — just show that tab, no prompt.
      if(s.ppTab!==state.tab) goToTab(s.ppTab, true);
      return;
    }
    // No tab entry left to unwind: the user is backing out of the app itself. Rather than
    // a confirm dialog (which is just another overlay the check above would have to tell
    // apart from every other modal, and which a spammed back button could desync), use
    // the standard "press back again to exit" pattern: the first press just re-arms the
    // guard and shows a toast; a second press within the window is let through for real.
    const now = Date.now();
    if(now - lastLeaveWarningAt < LEAVE_CONFIRM_WINDOW_MS){
      // Confirmed: don't re-push, let this back navigation actually leave (closing the
      // app if there's nowhere left to go, same as if the guard had never been installed).
      return;
    }
    lastLeaveWarningAt = now;
    history.pushState({ppTab:state.tab}, '', location.href);
    toast('Press back again to exit — your data is saved', LEAVE_CONFIRM_WINDOW_MS);
  });
}
/* ============ INIT ============ */
(async function init(){
  await loadAll();
  await applySmartLogDefault();
  registerPWA();
  const sharedText = await takeSharedSplit();
  installBackGuard();
  render();
  if(typeof sharedText==='string') openSplitPreview(sharedText);
  else if(sharedText===false) toast("Couldn't read the shared file", 3200);
})();
</script>
</body>
