<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Plate &amp; Progress</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js';"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js';"></script>
<style>
  :root{
    --bg:#121417;
    --surface:#1B1E23;
    --surface2:#22262C;
    --border:#2E333A;
    --text:#EDEAE3;
    --text-dim:#9A9FA6;
    --text-faint:#5D636B;
    --accent:#E8B32C;
    --accent-dim:#4A3D1C;
    --rust:#C1543A;
    --rust-dim:#3A2620;
    --good:#6FA97B;
    --good-dim:#22321F;
    --radius:10px;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;margin:0;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{display:none;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select{font-family:var(--font-mono);}

  /* header */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 18px 14px;border-bottom:1px solid var(--border);}
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .topbar .eyebrow{font-size:11px;color:var(--text-faint);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px;}
  .topbar h1{font-size:20px;}
  .plate-rule{display:flex;align-items:center;gap:6px;margin-top:12px;}
  .plate-rule .dot{width:7px;height:7px;border-radius:2px;background:var(--border);}
  .plate-rule .dot.hot{background:var(--accent);}
  .plate-rule .line{flex:1;height:1px;background:var(--border);}

  main{padding:16px 18px 24px;max-width:520px;margin:0 auto;}
  #main{transition:transform 0.17s cubic-bezier(.32,.72,.35,1), opacity 0.15s ease; will-change:transform,opacity;}
  #main.main-exit-left{transform:translateX(-6%) scale(0.985);opacity:0;}
  #main.main-exit-right{transform:translateX(6%) scale(0.985);opacity:0;}
  #main.main-enter-from-right{transition:none;transform:translateX(6%) scale(0.985);opacity:0;}
  #main.main-enter-from-left{transition:none;transform:translateX(-6%) scale(0.985);opacity:0;}

  /* nav */
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .navbtn{flex:1;background:none;border:none;color:var(--text-faint);padding:11px 4px 9px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;font-family:var(--font-display);font-weight:500;}
  .navbtn.active{color:var(--accent);}
  .navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;}

  /* stats */
  .stats-card{padding:15px 15px 14px;}
  .stats-tooltip{position:absolute;z-index:5;pointer-events:none;min-width:128px;max-width:190px;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.28);transform:translate(-50%,-112%);opacity:0;transition:opacity .12s ease;}
  .stats-tooltip.show{opacity:1;}
  .stats-tooltip .tt-title{font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .stats-tooltip .tt-value{font-family:var(--font-mono);font-size:15px;font-weight:600;margin-top:2px;}
  .stats-hit{fill:transparent;cursor:pointer;}
  .classification-btn{border:0;background:none;color:var(--text-faint);padding:2px 0;font:inherit;font-family:var(--font-mono);font-size:10.5px;cursor:pointer;text-align:left;}
  .classification-btn:hover{color:var(--accent);}

  /* stats 3d */
  .stats3d-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:440px;min-height:300px;border-radius:calc(var(--radius) + 2px);overflow:hidden;background:#0a0b0d;margin:2px 0 4px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  .stats3d-wrap canvas{display:block;width:100%;height:100%;}
  .stats3d-leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .stats3d-leader line{stroke:var(--accent);stroke-width:1.4;opacity:.85;}
  .stats3d-leader circle{fill:var(--accent);}
  .stats3d-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-family:var(--font-display);pointer-events:none;transition:opacity .2s;background:rgba(10,11,13,.6);padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.06);white-space:nowrap;}
  .stats3d-hint.hidden{opacity:0;}
  .stats3d-float{position:absolute;min-width:132px;max-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px 11px;box-shadow:0 10px 28px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .15s ease, transform .15s ease;pointer-events:none;}
  .stats3d-float.show{opacity:1;transform:translateY(0);}
  .stats3d-float .f-title{font-family:var(--font-display);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .stats3d-float .f-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .stats3d-float .f-row b{color:var(--text);font-family:var(--font-mono);font-weight:600;}
  .stats3d-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;color:var(--text-faint);}
  .stats3d-fallback svg{width:28px;height:28px;stroke:var(--text-faint);fill:none;stroke-width:1.4;margin-bottom:10px;}
  .stats3d-fallback p{font-size:12.5px;line-height:1.5;margin:0;}

  /* --- stats 3d: fullscreen + futuristic graph overlay --- */
  .stats3d-scanlines{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:screen;
    background:repeating-linear-gradient(0deg,#fff 0px,#fff 1px,transparent 1px,transparent 3px);}
  .stats3d-corner{position:absolute;width:18px;height:18px;pointer-events:none;opacity:.55;}
  .stats3d-corner::before,.stats3d-corner::after{content:'';position:absolute;background:var(--accent);}
  .stats3d-corner::before{width:100%;height:1.5px;}
  .stats3d-corner::after{width:1.5px;height:100%;}
  .stats3d-corner.tl{top:9px;left:9px;} .stats3d-corner.tr{top:9px;right:9px;transform:scaleX(-1);}
  .stats3d-corner.bl{bottom:9px;left:9px;transform:scaleY(-1);} .stats3d-corner.br{bottom:9px;right:9px;transform:scale(-1);}
  .stats3d-fs-btn{position:absolute;top:9px;right:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    background:rgba(10,11,13,.6);border:1px solid rgba(232,179,44,.35);border-radius:9px;color:var(--accent);z-index:6;
    backdrop-filter:blur(4px);transition:background .15s,border-color .15s;}
  .stats3d-fs-btn:active{background:rgba(232,179,44,.18);border-color:var(--accent);}
  .stats3d-fs-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  body.stats3d-fs-active{overflow:hidden;overscroll-behavior:none;}
  .stats3d-fs-overlay{position:fixed;inset:0;z-index:400;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:
      radial-gradient(ellipse at 50% 30%, #1a1d22 0%, #08090a 72%);
    display:none;flex-direction:column;touch-action:none;}
  .stats3d-fs-overlay.open{display:flex;}
  .stats3d-fs-overlay .stats3d-bg-grid{position:absolute;inset:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(232,179,44,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(232,179,44,.07) 1px,transparent 1px);
    background-size:34px 34px;mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 72%);}
  .stats3d-fs-topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(14px + env(safe-area-inset-top)) 14px 10px;}
  .stats3d-fs-title{font-family:var(--font-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center;}
  .stats3d-fs-title b{color:var(--accent);}
  .stats3d-fs-iconbtn{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;color:var(--text);}
  .stats3d-fs-iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .stats3d-fs-graphbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 15px 0 13px;flex:none;
    background:linear-gradient(180deg,rgba(232,179,44,.16),rgba(232,179,44,.06));border:1px solid rgba(232,179,44,.4);
    border-radius:18px;color:var(--accent);font-family:var(--font-display);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;}
  .stats3d-fs-graphbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .stats3d-fs-graphbtn.active{background:var(--accent);color:#1a1305;box-shadow:0 0 18px rgba(232,179,44,.45);}
  .stats3d-fs-stage{position:relative;flex:1;min-height:0;}
  .stats3d-fs-stage .stats3d-wrap{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-height:none;
    border-radius:0;margin:0;background:transparent;overscroll-behavior:none;
    transition:opacity .4s ease;}
  .stats3d-fs-stage.graph-open .stats3d-wrap{opacity:0;pointer-events:none;}
  .stats3d-fs-stage .stats3d-wrap .stats3d-fs-btn{display:none;}

  .stats3d-graph-panel{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px 20px;
    opacity:0;pointer-events:none;transition:opacity .4s ease;}
  .stats3d-fs-stage.graph-open .stats3d-graph-panel{opacity:1;pointer-events:auto;}
  .stats3d-graph-inner{position:relative;width:100%;max-width:400px;}
  .stats3d-graph-head{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:4px;text-align:center;}
  .stats3d-graph-head h3{font-size:15px;letter-spacing:.14em;text-transform:uppercase;}
  .stats3d-graph-head span{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.05em;}
  .stats3d-graph-swipe{margin-top:10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-faint);
    text-transform:uppercase;text-align:center;opacity:.7;}
  .fg-chart-wrap{position:relative;width:100%;max-width:360px;margin:10px auto 0;aspect-ratio:1/1;max-height:48vh;}
  .fg-chart{display:block;width:100%;height:100%;overflow:visible;}
  .fg-chart-inner{transition:opacity .25s ease;}
  .fg-chart-inner.hidden{opacity:0;pointer-events:none;}
  .fg-ring{fill:none;stroke:rgba(232,179,44,.16);stroke-width:1;}
  .fg-ring.outer{stroke:rgba(232,179,44,.3);stroke-dasharray:2 4;}
  .fg-axis{stroke:rgba(232,179,44,.14);stroke-width:1;}
  .fg-sweep{transform-origin:150px 150px;animation:stats3dSweep 4.5s linear infinite;}
  .fg-data{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(232,179,44,.55));}
  .fg-dot{fill:#0e0f11;stroke:var(--accent);stroke-width:2;animation:stats3dPulse 2.2s ease-in-out infinite;}
  .fg-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;fill:var(--text-dim);text-transform:uppercase;}
  .fg-label .b{fill:var(--accent);font-weight:600;}
  .fg-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .fg-metric{background:rgba(255,255,255,.03);border:1px solid rgba(232,179,44,.16);border-radius:10px;padding:8px 4px;text-align:center;}
  .fg-metric .fm-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.05em;color:var(--text-faint);text-transform:uppercase;}
  .fg-metric .fm-value{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--accent);margin-top:2px;}

  /* particle build/destroy effect */
  .fg-particle{fill:var(--accent);}
  .fg-particle-layer{filter:drop-shadow(0 0 2px rgba(232,179,44,.7));}
  .fg-particle-build{opacity:0;animation:fgParticleBuild .95s cubic-bezier(.16,.85,.24,1) forwards;will-change:transform,opacity;}
  .fg-particle-destroy{animation:fgParticleDestroy .7s cubic-bezier(.5,0,.85,1) forwards;will-change:transform,opacity;}
  @keyframes fgParticleBuild{
    0%{opacity:0;transform:translate(0,0) scale(.3);}
    18%{opacity:1;}
    100%{opacity:.85;transform:translate(var(--tx),var(--ty)) scale(1);}
  }
  @keyframes fgParticleDestroy{
    0%{opacity:.85;transform:translate(0,0) scale(1);}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.25);}
  }

  @keyframes stats3dSpin{to{transform:rotate(360deg);}}
  @keyframes stats3dSweep{to{transform:rotate(360deg);}}
  @keyframes stats3dPulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  @media (max-width:420px){ .fg-label{font-size:8px;} .stats3d-graph-head h3{font-size:11px;} }

  /* cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;margin-bottom:12px;}
  .card-title{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;font-family:var(--font-display);font-weight:500;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);
    padding:11px 16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn:active{transform:scale(0.98);}
  .btn-block{width:100%;}
  .btn-accent{background:var(--accent);color:#1A1200;border-color:var(--accent);font-weight:600;}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--text-dim);}
  .btn-danger{background:none;border:1px solid var(--rust);color:var(--rust);}
  .btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
  .icon-btn{background:none;border:none;color:var(--text-dim);padding:6px;display:flex;}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}

  label.field-label{display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 5px;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:10px 11px;font-size:15px;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .field{margin-bottom:12px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  .pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:500;
    border:1px solid var(--border);color:var(--text-dim);}
  .pill.accent{border-color:var(--accent);color:var(--accent);}

  .empty{text-align:center;padding:40px 20px;color:var(--text-faint);}
  .empty svg{width:34px;height:34px;stroke:var(--text-faint);fill:none;stroke-width:1.3;margin-bottom:10px;}
  .empty p{font-size:13px;line-height:1.5;margin:0 0 14px;}

  .exercise-list{position:relative;}
  .exercise-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);
    touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;background:var(--surface);}
  .exercise-row:last-child{border-bottom:none;}
  .exercise-row .grip{flex-shrink:0;display:flex;flex-direction:column;gap:3px;padding:4px 2px;color:var(--text-faint);}
  .exercise-row .grip span{width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:7px 0 0 currentColor;}
  .exercise-row .exname{flex:1;min-width:0;}
  .exercise-row .name{font-size:15px;font-weight:500;text-transform:uppercase;}
  .exercise-row .meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .exercise-row.dragging{box-shadow:0 6px 18px rgba(0,0,0,0.45);border-radius:8px;border-bottom-color:transparent;opacity:0.97;}
  .exercise-row.press-armed{background:var(--surface2);border-radius:8px;}

  .day-chip{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
    font-family:var(--font-display);font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:var(--text-dim);
    white-space:nowrap;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  .day-chip.press-armed{background:var(--surface2);transform:scale(0.98);}
  .day-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .day-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}

  .log-date-bar{display:flex;align-items:center;gap:6px;margin:-4px 0 14px;}
  .log-date-bar .ldb-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}
  .log-date-bar input[type=date]{width:auto;background:none;border:none;color:var(--accent);
    font-family:var(--font-mono);font-size:12.5px;font-weight:600;padding:2px 2px;}
  .log-date-bar input[type=date]:focus{outline:none;}
  .log-date-bar input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.6);padding:2px;margin-left:2px;}
  .log-date-today{background:none;border:none;color:var(--text-faint);font-size:11px;padding:2px 6px;
    border-radius:20px;border:1px solid var(--border);font-family:var(--font-body);}

  .split-switch-bar{display:flex;align-items:center;gap:6px;margin:-4px 0 14px;min-width:0;}
  .split-switch-bar select{width:auto;max-width:42%;background:none;border:none;color:var(--accent);
    font-family:var(--font-body);font-size:13px;font-weight:600;padding:2px 2px;}
  .split-switch-bar select:focus{outline:none;}
  .split-active-tag{font-size:11px;color:var(--good);white-space:nowrap;}
  .split-view-picker{position:relative;margin-left:auto;flex-shrink:0;}
  .split-view-trigger{width:38px;height:38px;padding:0;border:1px solid var(--border);border-radius:10px;background:var(--surface2);
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:background .16s ease,border-color .16s ease,color .16s ease;}
  .split-view-trigger:hover,.split-view-trigger:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
  .split-view-trigger svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .split-view-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:25;min-width:142px;padding:5px;border:1px solid var(--border);
    border-radius:10px;background:var(--surface);box-shadow:0 12px 28px rgba(0,0,0,.34);opacity:0;visibility:hidden;
    transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity .14s ease,transform .14s ease,visibility .14s ease;}
  .split-view-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
  .split-view-option{width:100%;height:36px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--text-dim);
    display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:left;}
  .split-view-option:hover,.split-view-option:focus-visible{background:var(--surface2);color:var(--text);outline:none;}
  .split-view-option.active{color:var(--accent);background:var(--accent-dim);}
  .split-view-option svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .split-gallery-arrow.at-edge{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);box-shadow:0 0 0 1px rgba(232,179,44,.12),0 0 12px rgba(232,179,44,.10);opacity:1;}
  .split-gallery-arrow.at-edge.edge-flash{animation:galleryEdgeFlash .65s ease;}
  @keyframes galleryEdgeFlash{0%{transform:scale(1)}35%{transform:scale(1.1);box-shadow:0 0 0 3px rgba(232,179,44,.16),0 0 18px rgba(232,179,44,.28)}100%{transform:scale(1)}}
  .split-gallery-shell{position:relative;overflow:hidden;border-radius:12px;}
  .split-gallery-track{position:relative;min-height:120px;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
  .split-day-card{will-change:transform,opacity;transform:translate3d(0,0,0);opacity:1;position:relative;z-index:3;}
  .split-day-card.is-stack-next,.split-day-card.is-stack-prev{position:absolute;inset:0;z-index:1;pointer-events:none;transform:translate3d(0,14px,0) scale(.965);opacity:.58;transition:transform .22s cubic-bezier(.22,.8,.24,1),opacity .22s ease;}
  .split-day-card.is-stack-prev{transform:translate3d(0,14px,0) scale(.965);opacity:.5;}
  .split-day-card.is-stack-next{transform:translate3d(0,12px,0) scale(.97);opacity:.62;}
  .split-day-card.is-stack-next.stack-reveal,.split-day-card.is-stack-prev.stack-reveal{transform:translate3d(0,0,0) scale(1);opacity:1;}
  .split-day-card.gallery-dragging{transition:none!important;}
  .split-day-card.gallery-snap{transition:transform .28s cubic-bezier(.22,.8,.24,1),opacity .22s ease;}
  .split-day-card.gallery-fly{transition:transform .30s cubic-bezier(.55,.1,.7,.25),opacity .24s ease;}
  .split-day-card.gallery-promote{transition:transform .30s cubic-bezier(.22,.8,.24,1),opacity .22s ease;}
  .split-gallery-card{margin:0;}
  .split-gallery-card .exercise-list{margin-top:2px;}
  .split-gallery-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
  .split-gallery-arrow{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);
    border-radius:9px;background:var(--surface2);color:var(--text-dim);transition:transform .16s ease,background .16s ease;}
  .split-gallery-arrow:active{transform:scale(.92);}
  .split-gallery-arrow:disabled{opacity:.3;}
  .split-gallery-arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .split-gallery-position{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;flex:1;}
  .split-gallery-dot{width:5px;height:5px;border-radius:50%;background:var(--text-faint);opacity:.55;transition:width .22s ease,opacity .22s ease,transform .22s ease;}
  .split-gallery-dot.active{width:15px;border-radius:5px;background:var(--accent);opacity:1;}
  .split-gallery-hint{text-align:center;font-size:10px;color:var(--text-faint);margin:8px 0 0;letter-spacing:.03em;}

  /* Fixed-size gallery "viewing window" — dimensions never change with exercise count,
     conceptually mirroring the fixed Stats 3D viewport container. */
  .split-gallery-viewport{position:relative;height:min(64vh,560px);min-height:400px;border-radius:12px;overflow:hidden;}
  .split-gallery-viewport .split-gallery-shell{position:absolute;inset:0;border-radius:12px;perspective:1100px;}
  .split-gallery-viewport .split-gallery-track{position:absolute;inset:0;height:100%;min-height:0;}
  .split-day-card.gallery-card-flex{position:absolute;inset:0;display:flex;flex-direction:column;margin:0;}
  .split-day-card.gallery-card-flex>.row-between{flex-shrink:0;}
  /* Keep the gallery maximize control clear of the day header's + Exercise button. */
  .split-gallery-viewport .split-day-card.gallery-card-flex>.row-between{padding-right:46px;}
  .split-day-card.gallery-card-flex .gallery-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -15px -14px;padding:0 15px 14px;}
  .split-gallery-maxbtn{position:absolute;top:14px;right:9px;z-index:6;width:30px;height:30px;border-radius:8px;
    background:rgba(18,20,23,.68);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
  .split-gallery-maxbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;}
  .split-gallery-maxbtn:active{transform:scale(.92);}

  /* Maximized full-window overlay */
  #gallery-max-overlay{position:fixed;inset:0;z-index:90;background:rgba(8,9,10,.94);display:flex;flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));}
  .gmax-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0;}
  .gmax-header .gmax-title{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}
  .gmax-close{width:34px;height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;}
  .gmax-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;}
  .gmax-close:active{transform:scale(.92);}
  .gmax-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .gmax-body .split-gallery-viewport{height:100%;min-height:0;flex:1;}
  .gmax-hint{text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:9px;flex-shrink:0;}

  /* Drag-progress hint pill (both normal + maximized) */
  .gallery-progress-pill{position:absolute;top:9px;left:50%;transform:translate(-50%,-6px);z-index:6;
    font-family:var(--font-display);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
    background:rgba(18,20,23,.72);padding:5px 12px;border-radius:20px;opacity:0;transition:opacity .15s ease,transform .15s ease;
    pointer-events:none;border:1px solid rgba(232,179,44,.35);white-space:nowrap;}
  .gallery-progress-pill.show{opacity:1;transform:translate(-50%,0);}

  /* Paper-fold corner handles + flap (maximized mode only) */
  .fold-handle{position:absolute;width:44px;height:44px;z-index:7;touch-action:none;}
  .fold-handle.fold-tr{top:0;right:0;}
  .fold-handle.fold-tl{top:0;left:0;}
  .fold-handle::after{content:'';position:absolute;width:15px;height:15px;opacity:.7;}
  .fold-handle.fold-tr::after{top:7px;right:7px;background:linear-gradient(135deg,transparent 48%,var(--accent) 50%);border-radius:0 4px 0 0;}
  .fold-handle.fold-tl::after{top:7px;left:7px;background:linear-gradient(-45deg,transparent 48%,var(--accent) 50%);border-radius:4px 0 0 0;}
  .fold-flap{position:absolute;top:0;z-index:5;pointer-events:none;background:linear-gradient(135deg,var(--surface2) 40%,var(--surface));
    box-shadow:-3px 3px 14px rgba(0,0,0,.45);opacity:0;border-radius:0 0 0 6px;}
  .fold-flap.fold-flap-tr{right:0;}
  .fold-flap.fold-flap-tl{left:0;}

  .set-log-row{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .set-log-row:active{background:var(--surface2);border-radius:8px;}
  .set-log-row:last-child{border-bottom:none;}
  .set-log-row .setnum{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);background:var(--surface2);
    border-radius:6px;min-width:30px;height:28px;padding:0 5px;display:flex;align-items:center;justify-content:center;}
  .set-log-row.warmup{background:rgba(232,179,44,.035);border-left:2px solid var(--accent);padding-left:8px;border-radius:7px;}
  .set-log-row.warmup .setnum{color:var(--accent);background:var(--accent-dim);}
  .set-log-row.warmup .val{color:var(--text-dim);}
  .set-log-row .val{font-family:var(--font-mono);font-size:15px;font-weight:600;}
  .set-log-row .val .unit{font-size:10.5px;color:var(--text-faint);font-weight:400;margin-left:2px;}
  .set-log-row.pr .val.weight{color:var(--accent);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-tile{background:var(--surface2);border-radius:8px;padding:11px 12px;}
  .stat-tile .label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
  .stat-tile .value{font-family:var(--font-mono);font-size:19px;font-weight:700;}
  .stat-tile .value .unit{font-size:11px;color:var(--text-dim);font-weight:400;}
  .stat-tile .sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .trend-up{color:var(--good);}
  .trend-down{color:var(--rust);}

  .overload-card{border-color:var(--border);}
  .overload-main{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .overload-kicker{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
  .overload-title{font-size:16px;font-weight:600;}
  .overload-status{font-family:var(--font-mono);font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;}
  .overload-detail{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .overload-chip{background:var(--surface2);border-radius:7px;padding:7px 9px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .overload-note{font-size:11.5px;color:var(--text-faint);line-height:1.45;margin-top:10px;}
  .overload-note-main{color:var(--text-faint);}
  .overload-note-meta{margin-top:6px;color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;}
  .overload-progress{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:9px;}
  .overload-progress>span{display:block;height:100%;background:var(--accent);border-radius:4px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,9,10,0.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;
    width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  .modal-title-row{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-bottom:16px;}
  .modal-title-row h2{font-size:16px;margin:0;min-width:0;}
  .modal-add-set-btn{width:38px;height:38px;min-width:38px;padding:0;border-radius:10px;font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .modal-close-row{display:flex;justify-content:flex-end;margin-bottom:-6px;}
  .bulk-set-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .bulk-set-row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 42px;gap:8px;align-items:end;background:var(--surface2);border-radius:9px;padding:10px;}
  .bulk-set-row .field-label{margin-bottom:4px;}
  .bulk-set-row input{width:100%;min-width:0;}
  .bulk-set-row .bulk-remove{height:42px;width:42px;padding:0;display:flex;align-items:center;justify-content:center;}
  .set-type-toggle{height:42px;width:44px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
  .set-type-toggle.warmup{color:var(--accent);background:var(--accent-dim);border-color:var(--accent);}
  .bulk-set-row.is-warmup{border-left:2px solid var(--accent);background:rgba(232,179,44,.055);}
  .bulk-set-row.is-warmup input{color:var(--text-dim);}
  @media(max-width:420px){
    .bulk-set-row{grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) 38px;gap:6px;padding:8px;}
    .bulk-set-row input{font-size:14px;}
    .set-type-toggle{width:42px;}
    .bulk-set-row .bulk-remove{width:38px;}
  }

  .archive-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .archive-item:last-child{border-bottom:none;}
  .archive-item .name{font-size:14.5px;font-weight:500;}
  .archive-item .dates{font-size:11.5px;color:var(--text-faint);margin-top:2px;font-family:var(--font-mono);}

  .chart-wrap{position:relative;width:100%;height:190px;margin:6px 0 4px;touch-action:manipulation;-webkit-user-select:none;user-select:none;}

  /* ===== Maximizable charts (chart-max.js) ===== */
  #chart-max-overlay{position:fixed;inset:0;z-index:120;background:#0E1013;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    opacity:0;transition:opacity .18s ease;touch-action:none;-webkit-user-select:none;user-select:none;}
  #chart-max-overlay.open{opacity:1;}
  .cm-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px;}
  .cm-title{font-family:var(--font-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .cm-tools{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .cm-btn,.cm-mode{height:34px;min-width:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    display:flex;align-items:center;justify-content:center;padding:0 8px;font-family:var(--font-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;}
  .cm-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;}
  .cm-mode{color:var(--accent);}
  .cm-btn:active,.cm-mode:active{background:var(--accent-dim);}
  .cm-close{color:var(--rust);}
  .cm-zoom{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);min-width:38px;text-align:center;}
  .cm-readout{display:flex;gap:8px;padding:0 14px 8px;overflow-x:auto;}
  .cm-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;min-width:68px;flex-shrink:0;}
  .cm-chip span{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .cm-chip b{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text);}
  .cm-legend{display:flex;align-items:center;gap:7px;padding:0 14px 8px;font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow-x:auto;}
  .cm-grad{display:inline-block;width:56px;height:7px;border-radius:4px;background:linear-gradient(90deg,#4D5E78,#C1543A,#E8B32C);}
  .cm-sep{width:1px;height:12px;background:var(--border);margin:0 4px;}
  .cm-dots{display:inline-flex;align-items:center;gap:3px;}
  .cm-dots u{display:inline-block;border-radius:50%;background:var(--text-dim);width:6px;height:6px;}
  .cm-dots u:nth-child(2){width:9px;height:9px;} .cm-dots u:nth-child(3){width:13px;height:13px;}
  .cm-stage{flex:1;min-height:0;position:relative;margin:0 8px;touch-action:none;}
  .cm-stage canvas{width:100%!important;height:100%!important;touch-action:none;}
  .cm-tip{position:absolute;display:none;z-index:3;pointer-events:none;max-width:86%;background:rgba(34,38,44,.97);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.45;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.45);}
  .cm-tip b{display:block;font-size:13px;font-weight:600;margin-bottom:2px;}
  .cm-panel{flex:none;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-top:1px solid var(--border);
    border-radius:16px 16px 0 0;transition:height .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom);}
  .cm-panel.drag{transition:none;}
  .cm-handle{flex:none;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;cursor:grab;}
  .cm-grip{width:44px;height:5px;border-radius:3px;background:var(--text-faint);}
  .cm-handle-text{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .cm-hint{flex:none;padding:0 14px 8px;font-size:11px;color:var(--text-faint);text-align:center;line-height:1.4;}
  .cm-table-wrap{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;padding:0 10px 14px;}
  .cm-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .cm-table th{position:sticky;top:0;background:var(--surface);text-align:left;font-family:var(--font-display);font-weight:500;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:7px 8px;border-bottom:1px solid var(--border);}
  .cm-table td{padding:8px;border-bottom:1px solid rgba(46,51,58,.55);font-family:var(--font-mono);color:var(--text);white-space:nowrap;}
  .cm-table td:first-child{color:var(--text-dim);}
  .cm-table tr.dim td{opacity:.3;}
  .cm-table tr.sel td{background:var(--accent-dim);color:var(--accent);}
  .cm-table tbody tr:active td{background:var(--surface2);}
  /* ===== Rest day ===== */
  .rest-day-panel{position:relative;text-align:center;padding:26px 18px 30px;border:1px solid var(--border);border-radius:var(--radius);
    background:radial-gradient(120% 90% at 50% 0%, rgba(232,179,44,.07), transparent 60%), var(--surface);overflow:hidden;}
  .rest-day-panel .rest-art{width:100%;max-width:340px;height:auto;display:block;margin:0 auto 18px;opacity:.96;}
  .rest-day-panel h2{font-size:20px;margin-bottom:8px;color:var(--accent);}
  .rest-day-panel p{margin:0 auto;max-width:300px;font-size:13px;line-height:1.55;color:var(--text-dim);}
  .rest-art .rest-stars{animation:restTwinkle 3.6s ease-in-out infinite;}
  .rest-art .rest-z text{opacity:0;animation:restZ 3.2s ease-in-out infinite;}
  .rest-art .rest-z .z2{animation-delay:.8s;} .rest-art .rest-z .z3{animation-delay:1.6s;}
  @keyframes restZ{0%{opacity:0;transform:translate(-6px,8px);}30%{opacity:.95;}100%{opacity:0;transform:translate(8px,-10px);}}
  @keyframes restTwinkle{0%,100%{opacity:.95;}50%{opacity:.45;}}
  @media (prefers-reduced-motion:reduce){.rest-art .rest-stars,.rest-art .rest-z text{animation:none;opacity:.8;}}
  .rest-badge{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
    background:var(--accent-dim);border-radius:6px;padding:4px 9px;}
  .segmented{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:3px;margin-bottom:14px;}
  .segmented button{flex:1;background:none;border:none;color:var(--text-faint);padding:8px 4px;border-radius:6px;
    font-size:12.5px;font-weight:500;font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.02em;}
  .segmented button.active{background:var(--surface);color:var(--accent);}

  .toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:20px;
    font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.2s;max-width:calc(100vw - 32px);text-align:center;}
  .toast.show{opacity:1;}

  /* ===== Previous Sessions (Log tab) ===== */
  .history-card{padding:0;overflow:hidden;}
  .history-toggle{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:0;color:var(--text);text-align:left;cursor:pointer;touch-action:manipulation;}
  .history-toggle:active{background:var(--surface2);}
  .history-toggle-label{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);flex-shrink:0;}
  .history-toggle-center{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:7px;}
  .history-toggle-date{font-family:var(--font-display);font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--text);white-space:nowrap;}
  .history-toggle-day{font-size:10.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

<script>
/* ============ STATE ============ */
let DB = { splits: [], exercises: [], sets: [], exerciseClassificationOverrides: {}, exerciseDatabase: null };
let state = { tab:'log', logDayId:null, logExerciseId:null, logDate:null, logHistoryDate:null, logHistoryOpen:false, splitEditId:null, splitViewId:null, splitViewMode:'list', splitGalleryDayIndex:0, progressSplitId:null, progressExerciseId:null, progressMetric:'e1rm', progressRange:'all', progressDayId:null, progressMode:'exercise', progressDaySessionDate:null, progressSplitAId:null, progressSplitBId:null, progressSplitSharedKey:null, statsRange:'week', statsSelectedGroup:null, stats3dFullscreen:false, stats3dGraphMode:'week', logRenameMode:false };
let DB_META = { lastAutoAssignDate:null };
let charts = {};
const $main = document.getElementById('main');
const $modalRoot = document.getElementById('modal-root');

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

const STATS_GROUPS = ['chest','back','shoulders','arms','legs','core'];
const STATS_LABELS = {chest:'CHEST',back:'BACK',shoulders:'SHOULDERS',arms:'ARMS',legs:'LEGS',core:'CORE'};
const EXERCISE_ALIAS_REPLACEMENTS = [
  [/\bdb\b/g,'dumbbell'], [/\bdd\b/g,'dumbbell'],
  [/\bbb\b/g,'barbell'], [/\bohp\b/g,'overhead press'],
  [/\brdl\b/g,'romanian deadlift'], [/\brdl\b/g,'romanian deadlift'],
  [/\bcgbp\b/g,'close grip bench press'], [/\bskullcrushers?\b/g,'skull crusher']
];
const EXERCISE_INTELLIGENCE_SCHEMA_VERSION = 1;
let exerciseClassificationIndex = null;

function normalizeExerciseName(name){
  let s = String(name||'').toLowerCase().trim();
  s = s.replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
  EXERCISE_ALIAS_REPLACEMENTS.forEach(([re,rep])=>{ s=s.replace(re,rep); });
  return s.replace(/\s+/g,' ').trim();
}
// Two exercise names are "the same exercise" for matching/merging purposes when they agree
// on case, punctuation, spacing AND word order — so "Barbell Curl", "barbell curls" and
// "Curls Barbell" all resolve to the same identity key. This is intentionally looser than
// normalizeExerciseName (which stays word-order-sensitive for exact catalog lookups) and is
// used for: recognizing an exercise already logged under a slightly different name, merging
// duplicate exercise entries, and pooling stats/progress for the same exercise cumulatively.
function exerciseIdentityKey(name){
  const norm = normalizeExerciseName(name);
  if(!norm) return '';
  return norm.split(' ').filter(Boolean).sort().join(' ');
}
function normalizeStatsGroup(group){
  const normalized = String(group||'').trim().toLowerCase();
  return STATS_GROUPS.includes(normalized) ? normalized : null;
}
function exactExerciseNameKey(name){
  return String(name||'').toLowerCase().trim().replace(/\s+/g,' ');
}
let exerciseClassificationIdentityIndex = null;
function buildExerciseClassificationIndex(){
  exerciseClassificationIndex = new Map();
  exerciseClassificationIdentityIndex = new Map();
  const bundled = (window.PLATE_PROGRESS_EXERCISE_DATABASE && window.PLATE_PROGRESS_EXERCISE_DATABASE.exercises) || [];
  const local = (DB.exerciseDatabase && Array.isArray(DB.exerciseDatabase.exercises)) ? DB.exerciseDatabase.exercises : [];
  // Imported records supplement the bundled catalog; when names overlap, imported
  // records are considered first so a user can carry a corrected/custom database.
  const records = [...local, ...bundled];
  records.forEach(r=>{
    // Catalog and user-entered names must use exactly the same canonical path.
    // `normalized_name` is retained as source metadata, but earlier catalog data
    // contains punctuation/whitespace variants that are not safe lookup keys.
    const key = normalizeExerciseName(r.name);
    if(!key || !normalizeStatsGroup(r.radar_group)) return;
    const recordsForKey = exerciseClassificationIndex.get(key) || [];
    recordsForKey.push(r);
    exerciseClassificationIndex.set(key,recordsForKey);
    // Word-order-insensitive fallback index (see exerciseIdentityKey) so a name typed
    // with its words in a different order still resolves to the same catalog entry.
    const idKey = exerciseIdentityKey(r.name);
    if(idKey){
      const idRecords = exerciseClassificationIdentityIndex.get(idKey) || [];
      idRecords.push(r);
      exerciseClassificationIdentityIndex.set(idKey,idRecords);
    }
  });
}
function builtInExerciseRecord(name){
  if(!exerciseClassificationIndex) buildExerciseClassificationIndex();
  let records = exerciseClassificationIndex.get(normalizeExerciseName(name)) || [];
  if(!records.length){
    // Fall back to a word-order/case/punctuation-insensitive match (e.g. "curls barbell"
    // vs "barbell curls") so minor phrasing differences still resolve to the same
    // catalog entry instead of silently landing as Unclassified.
    records = exerciseClassificationIdentityIndex.get(exerciseIdentityKey(name)) || [];
  }
  if(!records.length) return null;
  // A few catalog names collapse to one canonical key (for example, punctuation
  // variants). Preserve exact catalog-name recognition before applying the
  // established Plate & Progress source preference for an ambiguous alias.
  const exact = records.find(r=>exactExerciseNameKey(r.name)===exactExerciseNameKey(name));
  return exact || records.find(r=>(r.sources||[]).includes('plate_progress')) || records[0];
}
// Foundation for future intelligence providers. Current behavior deliberately
// remains exact catalog recognition plus persistent manual classification only.
function resolveExerciseIntelligence(name){
  const key = normalizeExerciseName(name);
  let override = DB.exerciseClassificationOverrides && DB.exerciseClassificationOverrides[key];
  if(!override && DB.exerciseClassificationOverrides){
    // Fall back to a word-order/case/punctuation-insensitive match, mirroring the
    // built-in database lookup below, so an exercise you've already classified by hand
    // doesn't silently fall back to Unclassified just because it was logged under a
    // slightly reordered or differently-punctuated name later.
    const idKey = exerciseIdentityKey(name);
    if(idKey){
      const matchKey = Object.keys(DB.exerciseClassificationOverrides).find(k=>exerciseIdentityKey(k)===idKey);
      if(matchKey) override = DB.exerciseClassificationOverrides[matchKey];
    }
  }
  if(override && STATS_GROUPS.includes(override.group)){
    return { group:override.group, source:'manual', recordId:null,
      resolvedAt:override.updatedAt || null,
      schemaVersion:override.schemaVersion || 0 };
  }
  const record = builtInExerciseRecord(name);
  const group = record && normalizeStatsGroup(record.radar_group);
  if(group){
    return { group, source:'database', recordId:record.id || null,
      resolvedAt:null, schemaVersion:EXERCISE_INTELLIGENCE_SCHEMA_VERSION };
  }
  return { group:null, source:'unknown', recordId:null,
    resolvedAt:null, schemaVersion:EXERCISE_INTELLIGENCE_SCHEMA_VERSION };
}
function builtInExerciseClassification(name){
  const record = builtInExerciseRecord(name);
  return record ? normalizeStatsGroup(record.radar_group) : null;
}
function classifyExercise(name){
  return resolveExerciseIntelligence(name).group;
}
function classificationSource(name){
  return resolveExerciseIntelligence(name).source;
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, duration=1800){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),duration); }

/* ============ LOCAL STORAGE (IndexedDB) ============ */
const DB_NAME = 'plate-progress-db';
const DB_VERSION = 1;
let idb = null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('data')) db.createObjectStore('data');
    };
    req.onsuccess=()=>{ idb=req.result; resolve(idb); };
    req.onerror=()=>reject(req.error);
  });
}
function idbGet(key){
  return new Promise((resolve,reject)=>{
    const req=idb.transaction('data','readonly').objectStore('data').get(key);
    req.onsuccess=()=>resolve(req.result ?? null); req.onerror=()=>reject(req.error);
  });
}
function idbSet(key,value){
  return new Promise((resolve,reject)=>{
    const req=idb.transaction('data','readwrite').objectStore('data').put(value,key);
    req.onsuccess=()=>resolve(true); req.onerror=()=>reject(req.error);
  });
}
async function loadAll(){
  try{
    await openDB();
    const [s,e,st,ov,meta,exdb]=await Promise.all([idbGet('splits'),idbGet('exercises'),idbGet('sets'),idbGet('exerciseClassificationOverrides'),idbGet('appMeta'),idbGet('exerciseDatabase')]);
    DB.splits=s||[]; DB.exercises=e||[]; DB.sets=st||[]; DB.exerciseClassificationOverrides=ov||{}; DB.exerciseDatabase=exdb||null;
    DB_META = meta || { lastAutoAssignDate:null };
    buildExerciseClassificationIndex();
    ensureExerciseOrder();
    if(mergeDuplicateExercisesWithinDays()) await Promise.all([idbSet('exercises',DB.exercises), idbSet('sets',DB.sets)]);
    if(ensureSplitDayHistory()) await idbSet('splits',DB.splits);
  }catch(err){ console.error('IndexedDB load failed',err); DB={splits:[],exercises:[],sets:[],exerciseClassificationOverrides:{},exerciseDatabase:null}; toast('Could not open local storage'); }
}
// One-time migration: give any exercise missing an `order` a sequential value within its day,
// so existing splits (created before drag-reorder existed) sort predictably.
function ensureExerciseOrder(){
  const nextByDay = {};
  DB.exercises.forEach(ex=>{
    if(typeof ex.order !== 'number'){
      const n = nextByDay[ex.dayId] ?? 0;
      ex.order = n;
      nextByDay[ex.dayId] = n+1;
    } else {
      nextByDay[ex.dayId] = Math.max(nextByDay[ex.dayId] ?? -1, ex.order+1);
    }
  });
}
// One-time repair: earlier versions never checked whether a day already had a matching
// exercise before creating a new one (and only matched exact, case-sensitive names in a
// couple of places), so the same exercise could end up as two or more separate records in
// one day — splitting its logged sets and stats across entries that never should have
// existed ("Kenan flaps" showing different numbers than "Kenan flaps", etc.). This merges
// any such duplicates (matched case/punctuation/word-order-insensitively) within the same
// day into a single canonical record — the earliest-created one — and reassigns every set
// from the duplicates onto it before discarding them. Safe to run on every load: once
// there are no duplicates left, it's a no-op.
function mergeDuplicateExercisesWithinDays(){
  let changed = false;
  const groups = new Map(); // `${dayId}|${identityKey}` -> exercise[]
  DB.exercises.forEach(ex=>{
    if(ex.archived) return; // archived exercises are frozen snapshots — never auto-merged
    const key = ex.dayId + '|' + exerciseIdentityKey(ex.name);
    const list = groups.get(key) || [];
    list.push(ex);
    groups.set(key, list);
  });
  const toRemove = new Set();
  groups.forEach(list=>{
    if(list.length<2) return;
    const sorted = list.slice().sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||'') || (a.order||0)-(b.order||0));
    const canonical = sorted[0];
    sorted.slice(1).forEach(dupe=>{
      DB.sets.forEach(s=>{ if(s.exerciseId===dupe.id) s.exerciseId=canonical.id; });
      toRemove.add(dupe.id);
      changed = true;
    });
  });
  if(changed) DB.exercises = DB.exercises.filter(e=>!toRemove.has(e.id));
  return changed;
}
// Preserve every day ID that has ever belonged to a split. This lets permanent
// split deletion clean up exercises from days that were later removed while editing.
function ensureSplitDayHistory(){
  let changed = false;
  DB.splits.forEach(split=>{
    const current = Array.isArray(split.days) ? split.days.map(d=>d.id) : [];
    const previous = Array.isArray(split.dayIds) ? split.dayIds : [];
    const merged = [...new Set([...previous, ...current])];
    if(merged.length !== previous.length || merged.some((id,i)=>id!==previous[i])){
      split.dayIds = merged;
      changed = true;
    }
  });
  return changed;
}

/* ============ SINGLE-SPLIT EXPORT / IMPORT ============ */
// Exports ONE split together with everything logged under it (every exercise, including
// archived ones, and every set) so it can be moved to another device. Importing adds it as a
// brand-new split next to whatever is already there — nothing existing is replaced. All IDs are
// regenerated on import so they can never collide with records on the receiving device.
function splitExercisesAndSets(split){
  const dayIds = new Set([...(split.dayIds||[]), ...(split.days||[]).map(d=>d.id)]);
  const exercises = DB.exercises.filter(e=>e.splitId===split.id || dayIds.has(e.dayId));
  const exIds = new Set(exercises.map(e=>e.id));
  const sets = DB.sets.filter(s=>exIds.has(s.exerciseId));
  return { dayIds, exercises, sets };
}
async function exportSplit(splitId){
  const split = splitById(splitId); if(!split){ toast('Split not found'); return; }
  const { exercises, sets } = splitExercisesAndSets(split);
  const overrides = {};
  exercises.forEach(e=>{ const k=normalizeExerciseName(e.name); if(k && DB.exerciseClassificationOverrides[k]) overrides[k]=DB.exerciseClassificationOverrides[k]; });
  downloadSplitPayload({ split, exercises, sets, exerciseClassificationOverrides:overrides });
}
function downloadSplitPayload(d){
  const payload = { version:1, app:'Plate & Progress', type:'split', exportedAt:new Date().toISOString(), data:d };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const safe=(d.split.name||'split').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'split';
  const a=document.createElement('a'); a.href=url; a.download='plate-progress-split-'+safe+'-'+todayStr()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Exported "${d.split.name}" (${d.exercises.length} exercises, ${d.sets.length} sets)`);
}
function parseSplitFileText(text){
  let parsed; try{ parsed=JSON.parse(text); }catch(e){ throw new Error('That file is not valid JSON'); }
  const d=parsed&&parsed.data;
  if(!parsed || parsed.type!=='split' || !d || !d.split || !Array.isArray(d.split.days) || !Array.isArray(d.exercises) || !Array.isArray(d.sets)){
    if(parsed && parsed.data && Array.isArray(parsed.data.splits)) throw new Error('This is a full backup — use "Import backup" for it.');
    throw new Error('Not a split export file');
  }
  return d;
}
// "Name" if free, otherwise "Name (imported)", "Name (imported 2)", ...
function uniqueSplitName(name){
  const base=String(name||'').trim()||'Imported split';
  const taken=new Set(DB.splits.map(s=>String(s.name).trim().toLowerCase()));
  if(!taken.has(base.toLowerCase())) return base;
  const first=base+' (imported)'; let n=first, i=2;
  while(taken.has(n.toLowerCase())) n=base+' (imported '+(i++)+')';
  return n;
}
function splitNameTaken(name){ const k=String(name).trim().toLowerCase(); return DB.splits.some(s=>String(s.name).trim().toLowerCase()===k); }
async function addImportedSplit(d, name){
  const src=d.split;
  const dayMap=new Map();
  [...(src.dayIds||[]), ...src.days.map(x=>x.id)].forEach(id=>{ if(id && !dayMap.has(id)) dayMap.set(id, uid('day')); });
  const exercises=d.exercises.filter(e=>e&&e.id&&dayMap.has(e.dayId));
  const exMap=new Map(exercises.map(e=>[e.id, uid('ex')]));
  const sets=d.sets.filter(s=>s&&exMap.has(s.exerciseId)&&s.date);
  const newSplitId=uid('split');
  const nowIso=new Date().toISOString();
  // Archived on arrival so it never displaces the split you're training on; if there is no
  // active split yet it becomes the active one.
  const hasActive=!!activeSplit();
  const newSplit={ ...src, id:newSplitId, name, days:src.days.map(x=>({...x, id:dayMap.get(x.id)})), dayIds:[...dayMap.values()], createdAt:src.createdAt||nowIso, archivedAt: hasActive ? nowIso : null };
  const newExercises=exercises.map(e=>({...e, id:exMap.get(e.id), splitId:newSplitId, dayId:dayMap.get(e.dayId)}));
  const newSets=sets.map(s=>({...s, id:uid('set'), exerciseId:exMap.get(s.exerciseId)}));
  DB.splits.push(newSplit);
  DB.exercises.push(...newExercises);
  DB.sets.push(...newSets);
  if(d.exerciseClassificationOverrides && typeof d.exerciseClassificationOverrides==='object'){
    Object.keys(d.exerciseClassificationOverrides).forEach(k=>{ if(!DB.exerciseClassificationOverrides[k]) DB.exerciseClassificationOverrides[k]=d.exerciseClassificationOverrides[k]; });
  }
  await Promise.all(['splits','exercises','sets','exerciseClassificationOverrides'].map(save));
  buildExerciseClassificationIndex();
  return { id:newSplitId, exercises:newExercises.length, sets:newSets.length };
}

function openSplitPreview(text){

function bindSplitPreview(ov){
  const refreshStats=()=>{ const el=document.getElementById('sp-stats'); if(el&&spPreview) el.innerHTML=spStatsLine(spPreview.d); };
  const exOf=el=>{ const row=el.closest('[data-ex]'); return row && spPreview.d.exercises.find(e=>e.id===row.dataset.ex); };
  ov.addEventListener('change', e=>{
    if(!spPreview) return;
    const t=e.target, k=t.dataset&&t.dataset.sp; if(!k) return;
    const d=spPreview.d;
    if(k==='split-name'){ d.split.name=t.value.trim()||d.split.name; t.value=d.split.name; spPreview.dirty=true; }
    else if(k==='day-name'){ const day=d.split.days.find(x=>x.id===t.closest('[data-day]').dataset.day); if(day){ day.name=t.value.trim()||day.name; t.value=day.name; spPreview.dirty=true; } }
    else if(k==='ex-name'){ const ex=exOf(t); if(ex){ ex.name=t.value.trim()||ex.name; t.value=ex.name; spPreview.dirty=true; } }
    else if(k==='set-weight'||k==='set-reps'){
      const s=d.sets.find(x=>x.id===t.closest('[data-set]').dataset.set); if(!s) return;
      const v=Number(t.value);
      const ok = k==='set-weight' ? (Number.isFinite(v)&&v>=0&&t.value!=='') : (Number.isInteger(v)&&v>0);
      if(!ok){ t.value=String(k==='set-weight'?s.weight:s.reps); toast('Enter a valid number'); return; }
      if(k==='set-weight') s.weight=v; else s.reps=v;
      spPreview.dirty=true;
    }
  });
  ov.addEventListener('click', e=>{
    if(!spPreview) return;
    const btn=e.target.closest('[data-sp]'); if(!btn || btn.tagName==='INPUT') return;
    const k=btn.dataset.sp, d=spPreview.d;
    if(k==='discard') closeSplitPreview(false);
    else if(k==='import') openSplitImportNameDialog();
    else if(k==='save-file') downloadSplitPayload({ split:d.split, exercises:d.exercises, sets:d.sets, exerciseClassificationOverrides:d.exerciseClassificationOverrides||{} });
    else if(k==='ex-toggle'){ const ex=exOf(btn); if(!ex) return; if(spPreview.open.has(ex.id)) spPreview.open.delete(ex.id); else spPreview.open.add(ex.id); renderSplitPreview(); }
    else if(k==='ex-del'){
      const ex=exOf(btn); if(!ex) return;
      const n=d.sets.filter(s=>s.exerciseId===ex.id).length;
      if(!confirm(`Remove "${ex.name}"${n?` and its ${n} logged set${n===1?'':'s'}`:''} from this file?`)) return;
      d.exercises=d.exercises.filter(x=>x.id!==ex.id); d.sets=d.sets.filter(s=>s.exerciseId!==ex.id);
      spPreview.dirty=true; renderSplitPreview();
    }
    else if(k==='ex-add'){

      const name=inp.value.trim(); if(!name){ inp.focus(); return; }
      const dayId=card.dataset.day;
      if(d.exercises.some(x=>x.dayId===dayId && !x.archived && exerciseIdentityKey(x.name)===exerciseIdentityKey(name))){ toast('That exercise is already on this day'); return; }
      const order=d.exercises.filter(x=>x.dayId===dayId).reduce((m,x)=>Math.max(m,(x.order||0)+1),0);
      d.exercises.push({ id:uid('ex'), splitId:d.split.id, dayId, name, archived:false, classified:!!classifyExercise(name), order, createdAt:new Date().toISOString() });
      spPreview.dirty=true; renderSplitPreview();
    }
    else if(k==='set-del'){
      const id=btn.closest('[data-set]').dataset.set;
      d.sets=d.sets.filter(s=>s.id!==id); spPreview.dirty=true; renderSplitPreview();
    }
    else if(k==='day-add'){
      const day={ id:uid('day'), name:'Day '+(d.split.days.length+1) };
      d.split.days.push(day); d.split.dayIds=[...new Set([...(d.split.dayIds||[]), day.id])];
      spPreview.dirty=true; renderSplitPreview();
    }
    else if(k==='day-del'){
      const day=d.split.days.find(x=>x.id===btn.closest('[data-day]').dataset.day); if(!day) return;
      const exs=d.exercises.filter(x=>x.dayId===day.id);
      const ids=new Set(exs.map(x=>x.id));
      const n=d.sets.filter(s=>ids.has(s.exerciseId)).length;
      if(!confirm(`Remove "${day.name}" with its ${exs.length} exercise${exs.length===1?'':'s'} and ${n} logged set${n===1?'':'s'} from this file?`)) return;
      d.split.days=d.split.days.filter(x=>x.id!==day.id);
      d.exercises=d.exercises.filter(x=>x.dayId!==day.id); d.sets=d.sets.filter(s=>!ids.has(s.exerciseId));
      spPreview.dirty=true; renderSplitPreview();
    }
  });
}

// "Bench press" on both Upper 1 and Upper 2), and earlier bugs could also create outright
// duplicate records for one day. Either way, the user experiences all of those as one
// exercise, so stats/progress must be pooled across every matching record — matching is
// case/punctuation/word-order-insensitive (see exerciseIdentityKey) and scoped to the same
// split so unrelated programs never get merged together.
function matchingExerciseIds(ex){
  if(!ex) return [];
  // Archived exercises are frozen the moment they're removed from a day — their history
  // stays exactly as logged and never pools with (or absorbs sets from) any other
  // exercise, active or archived, even one with an identical name.
  if(ex.archived) return [ex.id];
  const key = exerciseIdentityKey(ex.name);

// Day-scoped variant used ONLY by the Log tab (listing a day's logged sets, set numbering,
// warm-up numbering, duplicate checks). The same exercise can exist on several days; its

// given day* must never show up under — or collide with set numbers of — the same-named
// exercise on another day.
function sameDayExerciseIds(ex){
  if(!ex) return [];
  if(ex.archived) return [ex.id];
  const key = exerciseIdentityKey(ex.name);
  if(!key) return [ex.id];
  return DB.exercises.filter(e=> !e.archived && e.splitId===ex.splitId && e.dayId===ex.dayId && exerciseIdentityKey(e.name)===key).map(e=>e.id);

/* ============ LOGGED SESSIONS (real logged workouts, not split templates) ============ */
// A "session" here means the actual logged data for a calendar date — grouping every
// set that was logged on that date, regardless of which exercises/day they belong to.
// This is intentionally distinct from a scheduled split-day template.
let _sessionsCache = null, _sessionsCacheKey = null;
function allLoggedSessions(){
  const cacheKey = DB.sets.map(s=>[s.id,s.date,s.setNumber,s.weight,s.reps,s.setType||'working'].join(':')).join('|') + ':' + DB.exercises.length;
  if(_sessionsCache && _sessionsCacheKey===cacheKey) return _sessionsCache;
  const byDate = {};
  DB.sets.forEach(s=>{ (byDate[s.date]=byDate[s.date]||[]).push(s); });
  const sessions = Object.keys(byDate).sort().map(date=>{
    const daySets = byDate[date];
    const dayCounts = {};
    daySets.forEach(s=>{ const ex=exerciseById(s.exerciseId); if(ex) dayCounts[ex.dayId]=(dayCounts[ex.dayId]||0)+1; });
    const dayId = Object.keys(dayCounts).sort((a,b)=>dayCounts[b]-dayCounts[a])[0] || null;
    const day = dayId ? dayById(dayId) : null;
    const exIds = [...new Set(daySets.map(s=>s.exerciseId))];
    const exercises = exIds.map(id=>exerciseById(id)).filter(Boolean);
    const volume = daySets.reduce((a,s)=>a+(isWorkingSet(s)?s.weight*s.reps:0),0);
    return { date, dayId, dayName: day ? day.name : 'Session', exercises, sets:daySets.slice().sort((a,b)=>setSortValue(a)-setSortValue(b) || (a.exerciseId<b.exerciseId?-1:1)), volume, setCount:daySets.filter(isCountedLoggedSet).length, repCount:daySets.filter(isCountedLoggedSet).reduce((a,s)=>a+(Number(s.reps)||0),0) };
  });
  _sessionsCache = sessions; _sessionsCacheKey = cacheKey;
  return sessions;
}
function sessionsForDay(dayId){ return allLoggedSessions().filter(s=>s.dayId===dayId); }
function sessionByDate(date){ return allLoggedSessions().find(s=>s.date===date) || null; }

// History for the currently selected Log day must be scoped to that exact day.
// A calendar date can contain more than one split day, so we intentionally
// group only sets belonging to the requested day instead of using the
// date-level session grouping above. This keeps Upper 1 history separate from
// Lower 1 history even when both were logged on the same date.
let _dayHistoryCache = new Map();
function historySessionsForDay(dayId){
  if(!dayId) return [];
  const cacheKey = dayId + '|' + DB.sets.map(s=>[s.id,s.date,s.setNumber,s.weight,s.reps,s.setType||'working'].join(':')).join('|') + '|' + DB.exercises.length;
  const cached = _dayHistoryCache.get(dayId);
  if(cached && cached.key===cacheKey) return cached.sessions;

  const byDate = {};
  DB.sets.forEach(s=>{
    const ex = exerciseById(s.exerciseId);
    if(!ex || ex.dayId!==dayId) return;
    (byDate[s.date]=byDate[s.date]||[]).push(s);
  });

  const day = dayById(dayId);
  const sessions = Object.keys(byDate).sort().map(date=>{
    const daySets = byDate[date];
    const exIds = [...new Set(daySets.map(s=>s.exerciseId))];
    const exercises = exIds.map(id=>exerciseById(id)).filter(Boolean);
    const volume = daySets.reduce((a,s)=>a+(isWorkingSet(s)?s.weight*s.reps:0),0);
    return {
      date, dayId, dayName: day ? day.name : 'Session', exercises,
      sets: daySets.slice().sort((a,b)=>setSortValue(a)-setSortValue(b) || (a.exerciseId<b.exerciseId?-1:1)),
      volume, setCount:daySets.filter(isCountedLoggedSet).length, repCount:daySets.filter(isCountedLoggedSet).reduce((a,s)=>a+(Number(s.reps)||0),0)
    };
  });
  _dayHistoryCache.set(dayId, {key:cacheKey, sessions});
  return sessions;
}

/* ============ SMART NEXT-SESSION DEFAULT ============ */
// Runs once per calendar date (guarded by DB_META.lastAutoAssignDate) at app start.
// It only sets a sensible *default* day for today's Log view — it never touches
// logged history, never forces the date away from today, and any manual day
// selection the user makes afterward is respected for the rest of the day
// (this function won't run again until the next new calendar date).
async function applySmartLogDefault(){
  const today = todayStr();
  if(DB_META.lastAutoAssignDate === today) return; // already applied today
  DB_META.lastAutoAssignDate = today;
  await saveMeta();

  const split = activeSplit();
  if(!split || !split.days || !split.days.length) return;

  state.logDate = today;

  const orderedDayIds = split.days.map(d=>d.id);
  const sessions = allLoggedSessions().filter(s=> orderedDayIds.includes(s.dayId) && s.date <= today);
  if(!sessions.length) return; // no history yet — leave default (first day)

  const mostRecent = sessions[sessions.length-1]; // dates sorted ascending
  if(mostRecent.date === today){
    // Already logged something today — keep showing that day, don't jump ahead.
    state.logDayId = mostRecent.dayId;
    return;
  }
  // Nothing logged today yet: default to the day that follows the most recently
  // logged day in the split's ordered day list (wrapping around).
  const idx = orderedDayIds.indexOf(mostRecent.dayId);
  if(idx === -1) return;
  const nextDayId = orderedDayIds[(idx+1) % orderedDayIds.length];
  state.logDayId = nextDayId;
}

/* ============ TAB SWITCHING + SWIPE TRANSITION ============ */
// goToTab is the single entry point for changing tabs (nav taps and swipes both use it),
// so every tab change gets the same sliding "page turn" style transition, direction-aware:
// moving right through the tab order slides content out to the left / in from the right,
// and vice versa moving left.
let tabSwitching = false;
function goToTab(newTab, fromHistory){
  if(window.ChartMax && ChartMax.isOpen()) ChartMax.close();
  if(newTab===state.tab || tabSwitching) return;
  if(galleryMaximizeOpen) closeGalleryMaximize(); // never leave Split with the overlay still open
  const oldIdx = TAB_ORDER.indexOf(state.tab);
  const newIdx = TAB_ORDER.indexOf(newTab);
  const forward = newIdx > oldIdx;
  if(state.tab==='stats') destroyStats3D();
  if(state.tab==='progress') destroyCharts();
  tabSwitching = true;
  $main.classList.add(forward ? 'main-exit-left' : 'main-exit-right');
  setTimeout(()=>{
    state.tab = newTab;
    render();
    // Record this tab switch as its own history entry (unless we're the ones replaying
    // one, from the back-button handler below) so the hardware/browser back button steps
    // back through tabs first, and only reaches the "leave app?" prompt once the user is
    // already on the tab they landed on when the app opened.
    if(!fromHistory && appBackGuardReady) history.pushState({ppTab:newTab}, '', location.href);
    $main.classList.remove('main-exit-left','main-exit-right');
    $main.classList.add(forward ? 'main-enter-from-right' : 'main-enter-from-left');
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      $main.classList.remove('main-enter-from-right','main-enter-from-left');
      tabSwitching = false;
    }));
  }, 170);
}

/* ============ SWIPE BETWEEN TABS ============ */
// Horizontal swipe anywhere in the app moves between Log <-> Split <-> Progress <-> Stats,
// in the same left-to-right order as the bottom nav and header dots.
(function initSwipeTabs(){
  const MIN_DX = 60;            // minimum horizontal distance to count as a swipe
  const MAX_OFF_AXIS_RATIO = 0.6; // vertical drift must stay well below the horizontal distance
  const MAX_DURATION_MS = 700;
  let sx=0, sy=0, st=0, tracking=false;

  document.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    if($modalRoot.innerHTML.trim()!=='') return; // a modal is open, don't hijack its gestures
    if(galleryMaximizeOpen) return; // maximized Gallery overlay owns all gestures while open
    const t = e.target;
    // Protect controls and horizontally-scrollable areas. Exercise rows themselves
    // remain swipeable; vertical movement is handed back to scrolling/drag-reorder.
    // The Gallery card track owns its own horizontal drag (day swipe) — never let the
    // tab-swipe gesture compete with it.
    if(t.closest('.day-scroll') || t.closest('.chart-wrap') || t.closest('.segmented') ||
       t.closest('select') || t.closest('input') || t.closest('button') || t.closest('.stats3d-wrap') ||
       t.closest('.split-gallery-track') || t.closest('#gallery-max-overlay') || t.closest('#chart-max-overlay') || t.closest('#si-overlay') || t.closest('#sp-overlay')) return;
    const touch = e.touches[0];
    sx=touch.clientX; sy=touch.clientY; st=Date.now(); tracking=true;
  }, {passive:true});

  document.addEventListener('touchmove', e=>{
    if(!tracking || e.touches.length!==1) return;
    const touch=e.touches[0];
    const dx=touch.clientX-sx, dy=touch.clientY-sy;
    // Once movement is clearly vertical, stop tracking so normal page scroll or
    // long-press exercise reordering can proceed without interference.
    if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)*0.75) tracking=false;
  }, {passive:true});

  document.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking=false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - sx;
    const dy = touch.clientY - sy;
    const dt = Date.now() - st;
    if(dt > MAX_DURATION_MS) return;
    if(Math.abs(dx) < MIN_DX) return;
    if(Math.abs(dy) > Math.abs(dx) * MAX_OFF_AXIS_RATIO) return;

    const idx = TAB_ORDER.indexOf(state.tab);
    if(dx < 0 && idx < TAB_ORDER.length-1) goToTab(TAB_ORDER[idx+1]); // swiped left -> next tab
    else if(dx > 0 && idx > 0) goToTab(TAB_ORDER[idx-1]);              // swiped right -> previous tab
  }, {passive:true});

  document.addEventListener('touchcancel', ()=>{ tracking=false; }, {passive:true});
})();

/* ============ SPLIT MODAL (create/rename) ============ */
function openSplitModal(existingSplit){
  const isNew = !existingSplit;
  const days = isNew ? [{id:uid('day'),name:'Day 1'}] : existingSplit.days.map(d=>({...d}));
  let html = `
    <div class="modal-sheet">
      <div class="modal-close-row"><button class="icon-btn" id="m-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></div>
      <h2>${isNew ? 'New split' : 'Rename split'}</h2>
      <div class="field">
        <label class="field-label">Split name</label>
        <input type="text" id="m-splitname" placeholder="e.g. Upper Lower" value="${esc(isNew?'':existingSplit.name)}">
      </div>
      <div class="field">
        <label class="field-label">Training days</label>
        <div id="m-days"></div>
        <button class="btn btn-ghost btn-sm" id="m-addday" style="margin-top:6px;">+ Add day</button>
      </div>
      <button class="btn btn-accent btn-block" id="m-save">${isNew ? 'Create split' : 'Save changes'}</button>
      ${isNew && activeSplit() ? '<p style="font-size:11.5px;color:var(--text-faint);text-align:center;margin-top:10px;">Your current split and its history stay saved — this starts a fresh one.</p>' : ''}
    </div>`;
  $modalRoot.innerHTML = `<div class="modal-overlay" id="m-overlay">${html}</div>`;

  function renderDays(){
    document.getElementById('m-days').innerHTML = days.map((d,i)=>`
      <div class="field-grid" style="grid-template-columns:1fr auto;margin-bottom:8px;align-items:center;">
        <input type="text" data-i="${i}" class="m-day-input" value="${esc(d.name)}" placeholder="Day name">
        ${days.length>1 ? `<button class="icon-btn m-day-del" data-i="${i}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>` : '<span></span>'}
      </div>`).join('');
    document.querySelectorAll('.m-day-input').forEach(inp=> inp.oninput = e=> days[+e.target.dataset.i].name = e.target.value);
    document.querySelectorAll('.m-day-del').forEach(btn=> btn.onclick = e=>{ days.splice(+e.currentTarget.dataset.i,1); renderDays(); });
  }
  renderDays();
  document.getElementById('m-addday').onclick = ()=>{ days.push({id:uid('day'),name:'Day '+(days.length+1)}); renderDays(); };
  document.getElementById('m-close').onclick = closeModal;
  document.getElementById('m-overlay').onclick = e=>{ if(e.target.id==='m-overlay') closeModal(); };

  document.getElementById('m-save').onclick = async ()=>{
    const name = document.getElementById('m-splitname').value.trim();
    if(!name){ toast('Give your split a name'); return; }
    const cleanDays = days.filter(d=>d.name.trim()).map(d=>({id:d.id,name:d.name.trim()}));
    if(cleanDays.length===0){ toast('Add at least one day'); return; }

    if(isNew){
      const prev = activeSplit();
      if(prev) prev.archivedAt = new Date().toISOString();
      DB.splits.push({ id:uid('split'), name, days:cleanDays, dayIds:cleanDays.map(d=>d.id), createdAt:new Date().toISOString(), archivedAt:null });
      await save('splits');
      if(prev) toast('New split started — old one saved in Archive');
      else toast('Split created');
    } else {
      existingSplit.name = name;
      const oldDayIds = new Set(existingSplit.days.map(d=>d.id));
      const historicalDayIds = new Set(existingSplit.dayIds || []);
      const newDayIds = new Set(cleanDays.map(d=>d.id));
      // exercises on removed days get archived (history kept), not deleted
      oldDayIds.forEach(id=>{ if(!newDayIds.has(id)) DB.exercises.forEach(ex=>{ if(ex.dayId===id) ex.archived=true; }); });
      existingSplit.days = cleanDays;
      existingSplit.dayIds = [...new Set([...historicalDayIds, ...oldDayIds, ...newDayIds])];
      await save('splits');
      await save('exercises');
      toast('Split updated');
    }
    closeModal();
    render();
  };
}

function closeModal(){ $modalRoot.innerHTML=''; }

// Rename a training day directly from the Log tab. The day name lives on the split's
// day record, so changing it here updates every view that reads that day (including
// Split and any future references) while preserving the same day ID and all history.
function openDayRenameModal(splitId, dayId){
  const split = splitById(splitId);
  const day = split && split.days.find(d=>d.id===dayId);
  if(!split || !day) return;

  const html = `
    <div class="modal-sheet">
      <div class="modal-close-row"><button class="icon-btn" id="m-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></div>
      <h2 style="font-size:16px;margin-bottom:16px;">Rename day</h2>
      <div class="field">
        <label class="field-label">Day name</label>
        <input type="text" id="m-dayname" placeholder="e.g. Push, Pull, Legs" value="${esc(day.name)}" maxlength="40">
      </div>
      <button class="btn btn-accent btn-block" id="m-save">Save name</button>
    </div>`;

  $modalRoot.innerHTML = `<div class="modal-overlay" id="m-overlay">${html}</div>`;
  const input = document.getElementById('m-dayname');
  const close = ()=>closeModal();
  document.getElementById('m-close').onclick = close;
  document.getElementById('m-overlay').onclick = e=>{ if(e.target.id==='m-overlay') close(); };
  document.getElementById('m-save').onclick = async ()=>{
    const name = input.value.trim();
    if(!name){ toast('Give the day a name'); input.focus(); return; }
    day.name = name;
    await save('splits');
    closeModal();
    render();
    toast('Day renamed');
  };
  requestAnimationFrame(()=>{ input.focus(); input.select(); });
}

// Swap which split is "active" (the one Log tab logs against). The split being promoted
// keeps its own createdAt/history; the previously-active split is archived, not deleted.
async function switchToSplit(splitId){
  const target = splitById(splitId);
  if(!target || !target.archivedAt) return;
  const current = activeSplit();
  if(current) current.archivedAt = new Date().toISOString();
  target.archivedAt = null;
  await save('splits');
  state.logDayId = null; // let Log tab re-pick a valid day for the newly active split
  toast(`Switched to "${target.name}"`);
  render();
}

/* ============ EXERCISE MODAL ============ */
